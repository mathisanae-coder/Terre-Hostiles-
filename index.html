  if(c.sub==='visite'&&p.pact){
    const v=localVisit(p);G.disc.push(c);
    if(!v.ask){await sheet(`<div class="mono">Les Habitants</div><h2>Des alliés passent</h2>${cardHtml(c,{big:1,tag:'article',p})}${linesHtml(v.lines.map(t=>({t,c:'good'})))}${okBtn()}`);return}
    for(;;){
      const r=await sheet(`<div class="mono">Les Habitants</div><h2>Ils ont besoin de vous</h2><p>Un de leurs groupes est à court de vivres. Ils vous demandent une carte, sans promesse écrite.</p>
        <div class="btns"><button class="btn pri" data-r="give" ${p.hand.length?'':'disabled'}>Donner une carte</button><button class="btn" data-r="no">Refuser</button></div>`);
      let card=null;
      if(r.v==='give'){const pk=await pickCards('Votre aide','Quelle carte donnez-vous ?',p.hand,1,'Donner',true);if(!pk)continue;card=p.hand.find(h=>h.uid===pk[0])}
      const res=localHelp(p,card);await resultSheet(toneTitle(res.tone,'Ils s\'en souviendront','Rupture','Résultat'),res);return;
    }
  }
  for(;;){
    const r=await sheet(`<div class="mono">Les Habitants · réputation ${repLabel(p.rep)}${p.pact?' · alliance':''}</div><h2>Ils vous ont vu</h2>${cardHtml(c,{big:1,tag:'article',p})}
      <p>Comment vous présentez-vous ? Leur réaction leur appartient.</p>
      <div class="btns"><button class="btn" data-r="ouvert">Avancer, mains ouvertes</button>
      <button class="btn" data-r="present" ${p.hand.length?'':'disabled'}>Offrir un présent<small>une carte de votre main</small></button>
      <button class="btn" data-r="cacher">Se tenir à l'écart</button>
      <button class="btn" data-r="armes" ${ATK(p)?'':'disabled'}>Montrer ses armes<small>risqué, mais dissuasif</small></button></div>`);
    let gift=null;
    if(r.v==='present'){const pk=await pickCards('Votre présent','Quelle carte offrez-vous ?',p.hand,1,'Offrir',true);if(!pk)continue;gift=p.hand.find(h=>h.uid===pk[0])}
    const res=localDecide(p,r.v,gift);G.disc.push(c);
    const title={allie:'Une alliance',neutre:'Ils s\'éloignent',hostile:'Ils attaquent'}[res.issue];
    await sheet(`<div class="mono">La décision est la leur</div><h2>${title}</h2>${linesHtml(res.lines.map(t=>({t,c:res.tone})))}${okBtn()}`);
    if(res.issue==='neutre'&&p.hand.length&&p.vivant){
      const q=await sheet(`<h2>Un échange ?</h2><p>L'un d'eux montre un objet posé au sol. Ils attendent une carte de votre main.</p><div class="btns"><button class="btn pri" data-r="y">Échanger une carte</button><button class="btn ghost" data-r="n">Décliner</button></div>`);
      if(q.v==='y'){const pk=await pickCards('Échange','Quelle carte donnez-vous ?',p.hand,1,'Donner',true);if(pk){const g=p.hand.find(h=>h.uid===pk[0]);await resultSheet('Échange conclu',localTrade(p,g))}}
    }
    return;
  }
}

  const rows=RECIPES.map(r=>{
    const c=canCraft(p,r),mats=Object.entries(r.mats).map(([m,n])=>n+' '+m).join(' + ');
    const sub=mats+(r.tools.length?' · #'+r.tools.join(' #'):'')+(c.ok?'':' | manque : '+[...c.need,...c.tools.map(t=>'#'+t)].join(', '));
    return `<button class="btn" data-r="${esc(r.out)}" ${c.ok?'':'disabled'}>${esc(r.out)}${c.ok?pas(true):''}<small>${esc(sub)}</small></button>`;
  }).join('');
  const r=await sheet(`<h2>Fabriquer</h2><p>1 PA. Les matériaux viennent de votre main. <span class="pasleg mono" style="display:inline-flex">${pas(true)} = faisable maintenant</span></p><div class="btns">${rows}<button class="btn ghost" data-r="close">Retour</button></div>`,{dismiss:true});
  if(r.v==='close')return;
  const rec=RECIPES.find(x=>x.out===r.v);guideAfter('craft:'+r.v);await resultSheet('Fabriqué',doCraft(p,rec));
}

/* ----- cartes ----- */
async function cardMenu(uid){
  const p=cp(),c=p.hand.find(x=>x.uid===uid);if(!c)return;
  const ok=canPlay(p,c),lab={objet:'Équiper',food:'Consommer',soin:'Se soigner',habitat:'Construire',contre:'Utiliser',plante:'Mâcher'}[c.k];
  const dryOk=c.dry&&has(p,'feu')&&p.ap>=1;
  const r=await sheet(`${cardHtml(c,{big:1,tag:'article',p})}${ok.ok?'':`<p class="verdict">${esc(ok.why)}</p>`}
    <div class="btns">${lab?`<button class="btn pri" data-r="play" ${ok.ok?'':'disabled'}>${lab}${c.k==='habitat'?'<small>2 PA</small>':''}</button>`:''}
    ${c.dry?`<button class="btn" data-r="dry" ${dryOk?'':'disabled'}>Sécher<small>${dryOk?'1 PA · se conserve':'il faut du feu et 1 PA'}</small></button>`:''}
    <button class="btn ghost" data-r="close">Fermer</button></div>`,{dismiss:true});
  if(r.v==='dry'){const res=doDry(p,c);flash(res.lines[0]);render();return}
  if(r.v!=='play')return;
  let d=[];
  if(c.k==='habitat'&&c.cost){
    d=await pickCards(c.nom,`Choisissez ${c.cost} carte(s) à défausser pour construire.`,p.hand.filter(x=>x!==c),c.cost,'Construire',true);
    if(!d)return;
  }
  const out=play(p,c,d);flash(out[0]);render();
}
async function invMenu(uid){
  const p=cp(),c=p.inv.find(x=>x.uid===uid);if(!c)return;
  const isTrap=(c.tags||[]).includes('piège');
  const repWhy=c.max==null?'':c.dur>=c.max?'en parfait état':!has(p,'outil')?'il faut un outil (#outil)':!p.hand.some(x=>x.k==='mat')?'il faut un matériau en main':p.ap<1?'plus de PA':'';
  const r=await sheet(`${cardHtml(c,{big:1,tag:'article',p:null})}<div class="btns">
    ${c.max!=null?`<button class="btn" data-r="repair" ${canRepair(p,c)&&p.ap>=1?'':'disabled'}>Réparer${canRepair(p,c)&&p.ap>=1?pas(true):''}<small>${repWhy||'1 PA · +3 durabilité · consomme le matériau le moins précieux'}</small></button>`:''}
    ${isTrap&&!c.set?`<button class="btn" data-r="trap" ${p.ap>=1?'':'disabled'}>Tendre pour la nuit<small>1 PA · peut rapporter du gibier</small></button>`:''}
    <button class="btn ghost" data-r="close">Fermer</button></div>`,{dismiss:true});
  if(r.v==='repair'){const res=doRepair(p,c);flash(res.lines[0]);render()}
  if(r.v==='trap'){const res=doTrap(p,c);flash(res.lines[0]);render()}
}
const condInfo=()=>sheet(`<h2>Blessures</h2><div class="lines">${cp().cond.map(c=>`<p class="bad"><b>${COND_LABEL[c]}</b> : ${esc(COND_TXT[c])}</p>`).join('')}</div>${okBtn('Fermer','ghost')}`,{dismiss:true});
const localsInfo=()=>{const p=cp();return sheet(`<h2>Les Habitants</h2><p>Réputation : <b>${repLabel(p.rep)}</b>${p.pact?' · alliance en cours (chaque nuit : faim +1, eau +1, santé +1)':''}</p>
  <div class="lines"><p>Ils décident seuls : alliance, indifférence ou attaque.</p><p>Un présent, des mains ouvertes et une bonne réputation penchent la balance. Les armes brandies, une rupture ou un refus d'aide la font basculer dans l'autre sens.</p><p>Une alliance rompue ne revient qu'avec de la patience.</p></div>${okBtn('Fermer','ghost')}`,{dismiss:true})};

/* ----- fin de journée ----- */
async function deathFlow(p){
  await sheet(`<div class="mono">Fin de route</div><h2>${esc(p.nom)} est mort</h2><p>Cause : ${esc(p.cause)}. Il a tenu jusqu'au jour ${p.mort}.</p>${okBtn()}`);
  await closeTurn();
}

async function advance(){
  if(G.over){UI.screen='end';render();return}
  await enterTurn();
}
async function closeTurn(){
  nextTurn();UI.enc=false;
  await advance();
}

/* ----- cinématique de nuit (plein écran) ----- */
const NIGHT_LAND={
 desert:'M0 200 Q60 150 130 190 T260 175 T400 195 V260 H0Z',
 ocean:'M0 205 Q30 195 60 205 T120 205 T180 205 T240 205 T300 205 T360 205 T420 205 V260 H0Z',
 foret:'M0 210 L20 150 L40 210 L60 140 L85 210 L110 155 L135 210 L165 135 L195 210 L225 150 L250 210 L280 140 L310 210 L340 155 L370 210 L400 160 V260 H0Z',
 glacier:'M0 210 L50 160 L90 200 L150 140 L210 205 L270 165 L330 205 L380 170 L420 210 V260 H0Z',
 montagne:'M0 215 L70 130 L120 190 L190 100 L260 200 L320 145 L380 205 L420 170 V260 H0Z',
 jungle:'M0 215 L15 150 L35 215 L60 120 L90 215 L120 140 L150 215 L185 115 L215 215 L250 135 L285 215 L320 125 L350 215 L385 145 L420 215 V260 H0Z',
 savane:'M0 215 Q100 205 200 214 T420 212 V260 H0Z M300 214 V170 M280 172 H320 M290 170 H310',
 steppe:'M0 215 Q70 200 140 212 T280 208 T420 214 V260 H0Z',
 canyon:'M0 215 L0 140 L40 130 L60 215 L120 215 L130 120 L190 110 L210 215 L270 215 L290 135 L360 125 L380 215 L420 215 V260 H0Z',
 fjord:'M0 215 L0 120 L60 100 L110 215 L260 215 L310 95 L370 110 L420 130 V215 V260 H0Z',
 marais:'M0 215 Q50 205 100 215 T200 215 T300 215 T420 215 V260 H0Z M60 215 V175 M64 215 V170 M200 215 V180 M205 215 V172 M330 215 V178'
};
const nightSnap=p=>({pv:p.pv,sat:p.sat,eau:p.eau,ene:p.ene,moral:MORAL(p),kg:p.kg});
function nightStats(ctx){
  if(!ctx.before||!ctx.after)return '';
  const a=ctx.before,b=ctx.after;
  const row=(l,k,f)=>{const d=+(b[k]-a[k]).toFixed(1),cls=d>0?'good':d<0?'bad':'';return `<div class="ns ${cls}"><span class="mono">${l}</span><b>${f?f(b[k]):b[k]}</b><i>${f?(d?fmtD(d)+' kg':'stable'):(d>0?'▲ +'+d:d<0?'▼ −'+Math.abs(d):'= stable')}</i></div>`};
  return `<div class="nstats">${row('Santé','pv')}${row('Faim','sat')}${row('Eau','eau')}${row('Énergie','ene')}${row('Moral','moral')}${row('Poids','kg',v=>fmtKg(v)+' kg')}</div>`;
}
function nightScene(p,lines,ctx){
  return new Promise(res=>{
    const e=envOf(p),W=ctx.wx;
    const rain=W==='pluie'||W==='orage';
    const snow=p.env==='glacier'||p.env==='steppe'||W==='blizzard'||W==='gel';
    let stars='';for(let i=0;i<46;i++){const x=Math.random()*400,y=Math.random()*150,r=.6+Math.random()*1.3,d=(Math.random()*2.2).toFixed(2);stars+=`<circle class="star" cx="${x.toFixed(0)}" cy="${y.toFixed(0)}" r="${r.toFixed(1)}" fill="#fff" style="animation-delay:${(1+Math.random()*1.4).toFixed(2)}s,${d}s"/>`}
    let fall='';
    if(rain)for(let i=0;i<26;i++){const x=Math.random()*400;fall+=`<line class="drop" x1="${x.toFixed(0)}" y1="0" x2="${(x-4).toFixed(0)}" y2="14" style="animation-delay:${(Math.random()*.7).toFixed(2)}s"/>`}
    if(snow)for(let i=0;i<24;i++){const x=Math.random()*400;fall+=`<circle class="drop" cx="${x.toFixed(0)}" cy="0" r="1.6" fill="#fff" stroke="none" style="animation-duration:${(2+Math.random()*2).toFixed(1)}s;animation-delay:${(Math.random()*2).toFixed(1)}s"/>`}
    const fire=ctx.fire?`<g class="flame on" transform="translate(300 192)"><path d="M0 0 C-9 -4 -7 -16 0 -26 C2 -16 9 -12 7 -3 Z" fill="#ff9a2e"/><path d="M0 0 C-4 -3 -3 -10 0 -15 C2 -9 5 -7 3 -2 Z" fill="#ffe27a"/></g>`:'';
    const hab=ctx.hab>=1?`<g transform="translate(250 ${ctx.hab>=2?176:184})" fill="#0b1020" stroke="${e.tint}" stroke-width="1.5"><path d="M0 28 L26 0 L52 28 Z"/>${ctx.hab>=2?'<rect x="8" y="28" width="36" height="8"/>':''}</g>`:'';
    const dead=!p.vivant;
    const el=document.createElement('div');el.className='night';el.setAttribute('role','dialog');el.setAttribute('aria-modal','true');
    el.innerHTML=`<div class="sky"><svg viewBox="0 0 400 260" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      ${stars}
      <g class="moon"><circle cx="300" cy="55" r="22" fill="#f4f1de"/><circle cx="310" cy="49" r="19" fill="#14204f" opacity=".35"/></g>
      <g class="sun"><circle cx="110" cy="105" r="30" fill="#ffd27a"/></g>
      <g>${fall}</g>
      <path d="${NIGHT_LAND[p.env]||NIGHT_LAND.desert}" fill="#050813" stroke="${e.tint}" stroke-width="1.2" opacity=".96"/>
      ${hab}${fire}
    </svg><div class="cap">${esc(e.nom)} · nuit ${G.jour}</div></div>
    <div class="body"><div class="mono" style="color:#9fb0cc">${esc(p.nom)}</div><h2>${dead?'La nuit a été fatale':'Ce qui s\'est passé cette nuit'}</h2>
    ${nightStats(ctx)}
    <div class="lines">${lines.map((x,i)=>`<p class="${x.c||''}" style="animation-delay:${(2.4+i*.35).toFixed(2)}s">${esc(x.t)}</p>`).join('')}</div>
    <button class="btn pri" data-r="ok">${dead?'Continuer':'Se réveiller'}</button></div>`;
    mount(el,null,document.body);
    el.addEventListener('click',ev=>{if(ev.target.closest('[data-r]')){el.remove();res()}});
    const b=el.querySelector('[data-r]');if(b)setTimeout(()=>b.focus({preventScroll:true}),2400);
  });
}
async function endTurn(){
  const p=cp();
  if(p.ap>0){
    const r=await sheet(`<h2>Terminer la journée ?</h2><p>Il vous reste ${p.ap} point${p.ap>1?'s':''} d'action. Les PA non utilisés ménagent votre énergie cette nuit.</p><div class="btns"><button class="btn pri" data-r="y">Terminer</button><button class="btn ghost" data-r="n">Continuer à jouer</button></div>`);
    if(r.v!=='y')return;
  }
  if(p.hand.length>handMax(p)){
    const n=p.hand.length-handMax(p);
    const ds=await pickCards('Main trop pleine',`Défaussez ${n} carte${n>1?'s':''}.`,p.hand,n,'Défausser');
    ds.forEach(u=>{const c=p.hand.find(x=>x.uid===u);if(c){removeFrom(p.hand,c);G.disc.push(c)}});
  }
  writeSave();UI.enc=true;
  const ctx={wx:p.wx,fire:tagList(p).includes('feu'),hab:p.hab,before:nightSnap(p)},day0=G.jour;
  const lines=endDay(p);
  fx('night');
  ctx.after=nightSnap(p);
  await nightScene(p,lines,ctx);
  if(!p.vivant){await deathFlow(p);return}
  await closeTurn();
}

/* ----- actions de l'écran ----- */
async function beginExpedition(){
  G.players.forEach(startPlayer);log('L\'expédition commence.');
  await advance();
}
const ACT={
  start(){
    saveNames();const scn=UI.mode==='libre'?null:UI.mode==='daily'?dailyScenario():SCENARIOS.find(x=>x.id===UI.mode);
    if(!scn){UI.jours=+$('#jours').value;UI.diff=+$('#diff').value}
    const c=UI.ch,spec={nom:(c.nom||'').trim()||'Vous',sex:c.sex,age:parseInt(c.age)||35,ht:parseInt(c.ht)||175,kg:parseFloat(String(c.kg).replace(',','.'))||0,fit:+c.fit,back:c.back,temp:c.temp,motiv:c.motiv};
    newGame([spec],UI.jours,UI.diff,scn);
    G.guide=+c.guide===1;G.analyse=+c.analyse===1;if(!scn&&c.env&&c.env!=='random')G.forceEnv=c.env;
    if(scn)logj('Scénario : '+scn.nom+'. '+scn.txt,null);
    UI.ei=0;UI.shown=false;UI.enc=false;UI.screen='envdraw';render();
  },
  envdraw(){drawEnv(G.players[0]);UI.shown=true;render()},
  async envnext(){await beginExpedition()},
  bilan(b){return helpSheet('bilan',null,+b.dataset.id)},
  sound(){OPTS.snd=OPTS.snd?0:1;saveOpts();if(OPTS.snd){audioOn();ambience()}else stopAmb();flash(OPTS.snd?'Son activé':'Son coupé');render()},
  savenow(){flushSave();flash('Partie sauvegardée.')},
  explore:()=>explore(),
  actions:()=>actionsMenu(),
  end:()=>endTurn(),
  card:b=>cardMenu(+b.dataset.uid),
  inv:b=>invMenu(+b.dataset.uid),
  cache:b=>cacheMenu(+b.dataset.uid),
  cond:()=>condInfo(),
  point:()=>pointSheet(),
  locals:()=>localsInfo(),
  rules:()=>helpSheet(),
  again(){UI.screen='setup';render()},
  async resume(b){
    const sv=loadSaves().find(x=>x.id===b.dataset.id);if(!sv)return;
    if((+sv.v||0)>SAVE_V){flash('Cette sauvegarde vient d\'une version plus récente du jeu.');return}
    const st=cleanSave(sv);
    if(!st){flash('Sauvegarde illisible : supprimez-la.');return}
    G=st.G;UID=st.UID;UI.ei=0;UI.shown=st.ui.shown;UI.enc=false;
    if(st.ui.screen==='envdraw'){UI.screen='envdraw';render();return}
    await advance();
  },
  delsave(b){dropSave(b.dataset.id);render()},
  registre:()=>helpSheet('registre'),
  journal:()=>helpSheet('journal')
};
function saveNames(){
  const g=id=>{const e=$('#'+id);return e?e.value:null},c=UI.ch,set=(k,id)=>{const v=g(id);if(v!==null)c[k]=v};
  set('nom','f_nom');set('sex','f_sex');set('age','f_age');set('ht','f_ht');set('kg','f_kg');set('fit','f_fit');set('back','f_back');set('temp','f_temp');set('motiv','f_motiv');set('env','f_env');set('guide','f_guide');set('analyse','f_analyse');
}
document.addEventListener('change',e=>{
  if(UI.screen!=='setup')return;
  if(e.target.id==='mode'){saveNames();UI.mode=e.target.value;render()}
});
window.addEventListener('pagehide',flushSave);
document.addEventListener('visibilitychange',()=>{if(document.hidden)flushSave()});
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]');
  if(!b||UI.busy||b.disabled)return;
  fx('click');
  UI.busy=true;
  try{await ACT[b.dataset.act](b)}catch(err){console.error(err);flash('Erreur : '+err.message)}
  finally{UI.busy=false}
});
render();
</script>
