<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Terres Hostiles Réel</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" media="print" onload="this.media='all'"><noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"></noscript><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<style>
/* Concept : carnet d'expédition sur fond topographique ; une couleur d'encre par famille de cartes, orange balise pour le danger */
:root{
  --bg:#e4e9de;--panel:#f3f5ee;--panel2:#d9dfd2;--ink:#14231f;--muted:#53645c;--line:#b1bcab;
  --acc:#d6460a;--on-acc:#ffffff;--ok:#2e7d4f;--bad:#b3261e;--topo:rgba(20,35,31,.075);--on-k:#ffffff;
  --k-objet:#2f5d7c;--k-food:#587824;--k-soin:#b0385a;--k-contre:#1d7771;--k-habitat:#9a6a22;--k-pred:#a3341d;--k-proie:#6a5628;--k-malus:#59398c;--k-mat:#76664a;--k-chance:#9c7210;--k-locaux:#8a4b2d;--k-plante:#2f7a52;--k-visiteur:#6b5a8a;
  --f-disp:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1614;--panel:#15211e;--panel2:#1d2c28;--ink:#e4ede7;--muted:#92a69c;--line:#2b3d37;
  --acc:#ff7b3e;--on-acc:#1a0d05;--ok:#6fcf97;--bad:#ff7a6e;--topo:rgba(228,237,231,.05);--on-k:#0d1614;
  --k-objet:#82b6d8;--k-food:#a8c968;--k-soin:#f08aa6;--k-contre:#6fd1c9;--k-habitat:#e2b867;--k-pred:#ff8c6d;--k-proie:#d3b97a;--k-malus:#b9a2f2;--k-mat:#c8b48c;--k-chance:#f2c14e;--k-locaux:#f0a27b;--k-plante:#6fd0a0;--k-visiteur:#c0b0e8;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1614;--panel:#15211e;--panel2:#1d2c28;--ink:#e4ede7;--muted:#92a69c;--line:#2b3d37;
  --acc:#ff7b3e;--on-acc:#1a0d05;--ok:#6fcf97;--bad:#ff7a6e;--topo:rgba(228,237,231,.05);--on-k:#0d1614;
  --k-objet:#82b6d8;--k-food:#a8c968;--k-soin:#f08aa6;--k-contre:#6fd1c9;--k-habitat:#e2b867;--k-pred:#ff8c6d;--k-proie:#d3b97a;--k-malus:#b9a2f2;--k-mat:#c8b48c;--k-chance:#f2c14e;--k-locaux:#f0a27b;--k-plante:#6fd0a0;--k-visiteur:#c0b0e8;color-scheme:dark}

/* thème par environnement : teinte, saturation et accent changent selon la carte tirée */
:root[data-env="desert"]{--eh:34;--ess:45;--ea:#b8400a;--ea-d:#ff9a4d}
:root[data-env="ocean"]{--eh:205;--ess:50;--ea:#0b6a8f;--ea-d:#5cc8ee}
:root[data-env="foret"]{--eh:125;--ess:38;--ea:#2f6b2a;--ea-d:#7fd36f}
:root[data-env="glacier"]{--eh:195;--ess:38;--ea:#2f5fae;--ea-d:#8cb8ff}
:root[data-env="montagne"]{--eh:25;--ess:14;--ea:#8a4a22;--ea-d:#e0a477}
:root[data-env="marais"]{--eh:72;--ess:40;--ea:#6f6410;--ea-d:#cdc455}
:root[data-env="jungle"]{--eh:140;--ess:50;--ea:#1d6a3a;--ea-d:#5fd68a}
:root[data-env="savane"]{--eh:42;--ess:50;--ea:#9a6a10;--ea-d:#e8b84d}
:root[data-env="steppe"]{--eh:65;--ess:25;--ea:#6c7040;--ea-d:#c3c88a}
:root[data-env="canyon"]{--eh:16;--ess:52;--ea:#a64f2a;--ea-d:#f09a70}
:root[data-env="fjord"]{--eh:200;--ess:28;--ea:#2f6b82;--ea-d:#82cbe6}
.tip,.guidep{border-left:4px solid var(--acc,var(--ea));background:var(--panel2);padding:8px 10px;border-radius:0 6px 6px 0;margin-block:6px;font-size:13px}
.guidep p{margin:4px 0}.guidep p.bad{color:var(--bad)}
.fact.bad{border-color:var(--bad);color:var(--bad)}.fact.ok{border-color:var(--line)}
:root[data-env]{--bg:hsl(var(--eh) calc(var(--ess)*.9%) 89%);--panel:hsl(var(--eh) calc(var(--ess)*.7%) 95%);--panel2:hsl(var(--eh) calc(var(--ess)*.6%) 84%);--line:hsl(var(--eh) calc(var(--ess)*.45%) 70%);--ink:hsl(var(--eh) 35% 11%);--muted:hsl(var(--eh) 18% 32%);--acc:var(--ea);--on-acc:#fff;--topo:hsl(var(--eh) 40% 20% / .09)}
@media (prefers-color-scheme:dark){:root[data-env]:not([data-theme="light"]){--bg:hsl(var(--eh) calc(var(--ess)*.7%) 7%);--panel:hsl(var(--eh) calc(var(--ess)*.6%) 11%);--panel2:hsl(var(--eh) calc(var(--ess)*.55%) 16%);--line:hsl(var(--eh) calc(var(--ess)*.5%) 24%);--ink:hsl(var(--eh) 25% 92%);--muted:hsl(var(--eh) 15% 68%);--acc:var(--ea-d);--on-acc:#10100c;--topo:hsl(var(--eh) 30% 90% / .05)}}
:root[data-env][data-theme="dark"]{--bg:hsl(var(--eh) calc(var(--ess)*.7%) 7%);--panel:hsl(var(--eh) calc(var(--ess)*.6%) 11%);--panel2:hsl(var(--eh) calc(var(--ess)*.55%) 16%);--line:hsl(var(--eh) calc(var(--ess)*.5%) 24%);--ink:hsl(var(--eh) 25% 92%);--muted:hsl(var(--eh) 15% 68%);--acc:var(--ea-d);--on-acc:#10100c;--topo:hsl(var(--eh) 30% 90% / .05)}
body{transition:background-color .5s}
.brand{display:flex;align-items:center;gap:10px;color:var(--acc)}
.brand .emblem{width:34px;height:34px;flex:none}
.brand .mono{color:var(--muted)}
.emblem{display:block;color:var(--acc)}
.envtag .emblem{color:#fff;width:40px;height:40px}
.envcard .emblem{color:#fff;width:84px;height:84px;opacity:.95}
.hell{color:var(--bad)}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-block:6px 10px;position:sticky;top:-18px;background:var(--bg);padding-block:6px;z-index:2}
.tabs button{flex:0 0 auto;min-height:44px;padding:0 12px;border:1.5px solid var(--line);background:transparent;border-radius:6px;font-weight:600;cursor:pointer}
.tabs button.on{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
.help h3{font:800 20px var(--f-disp);text-transform:uppercase;margin-block:14px 4px;letter-spacing:.02em}
.help ul{margin:4px 0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.help .tip{border-left:4px solid var(--acc);background:var(--panel2);padding:8px 10px;border-radius:0 6px 6px 0;margin-block:6px}
.help .tip.bad{border-color:var(--bad)}
.help table{border-collapse:collapse;width:100%;font-size:13px}.help td{border-bottom:1px solid var(--line);padding:5px 4px;vertical-align:top}

.save{border:1.5px solid var(--ink);background:var(--panel);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:10px;margin-top:10px}
.swhat{display:flex;gap:12px;align-items:center}.swhat .emblem{flex:none;color:var(--acc)}
.sbtns{display:flex;gap:8px}.sbtns .btn:first-child{flex:3}
.saved{color:var(--ok)}

.spark{width:100%;height:70px;display:block;color:var(--acc)}
.codebox{width:100%;min-height:96px;font:16px/1.3 var(--f-mono);background:var(--panel);color:var(--ink);border:1.5px solid var(--line);border-radius:6px;padding:8px;word-break:break-all}
*{box-sizing:border-box}
body{background-color:var(--bg);background-image:repeating-radial-gradient(ellipse at 12% -4%,transparent 0 26px,var(--topo) 26px 27px);color:var(--ink);font:15px/1.45 var(--f-body);padding-inline:16px;padding-block:12px 110px;min-height:100%}
#app{max-width:560px;margin-inline:auto;display:flex;flex-direction:column;gap:14px}
h1,h2,h3,p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.mono{font-family:var(--f-mono);letter-spacing:.08em;text-transform:uppercase;font-size:12px;color:var(--muted)}
.disp{font-family:var(--f-disp);text-transform:uppercase;font-weight:800;letter-spacing:.02em;line-height:.95}

/* boutons */
.btn{position:relative;min-height:46px;padding:0 16px;border:1.5px solid var(--ink);background:transparent;border-radius:6px;font-weight:600;cursor:pointer;flex:1}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
.btn.ghost{border-color:var(--line);color:var(--muted)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.pas{position:absolute;top:-7px;right:-5px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--ok);color:var(--on-k);border:2px solid var(--bg);font:700 12px/16px var(--f-mono);text-align:center;box-sizing:border-box;pointer-events:none}
.pas.dot{min-width:14px;width:14px;height:14px;padding:0;top:-5px;right:-4px}
.card header .pas{position:static;flex:none;width:16px;min-width:16px;height:16px;padding:0;border:0;background:radial-gradient(circle,var(--ok) 0 36%,var(--on-k) 40%);box-shadow:0 0 0 1.5px var(--ok)}
.card header .hr{display:inline-flex;align-items:center;gap:6px}
.pasleg{display:flex;align-items:center;gap:6px}.pasleg .pas{position:static;pointer-events:none}
.btn small{display:block;font:400 12px var(--f-mono);opacity:.85}
.bar{position:fixed;inset-inline:0;bottom:0;background:var(--panel);border-top:1.5px solid var(--ink);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));z-index:10}
.bar>div{max-width:560px;margin-inline:auto;display:flex;gap:8px}

/* entête */
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;border-bottom:2px solid var(--ink);padding-bottom:8px}
.tools{display:flex;gap:8px;margin-top:8px}.tools .btn{flex:1;min-height:44px;padding:0 8px}
.top .who{font-size:34px}
.day{font:500 12px var(--f-mono);letter-spacing:.1em;text-align:right}
.day b{display:block;font:800 30px var(--f-disp);letter-spacing:.02em}

/* adversaires */
.rivals{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.rival{flex:0 0 auto;min-width:132px;text-align:left;background:var(--panel);border:1.5px solid var(--line);border-radius:6px;padding:8px 10px;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.rival b{font:800 17px var(--f-disp);text-transform:uppercase}
.rival.dead{opacity:.45;text-decoration:line-through}
.mini{display:flex;gap:8px;font:500 12px var(--f-mono)}

/* panneau joueur */
.panel{background:var(--panel);border:1.5px solid var(--ink);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:10px}
.envrow{display:flex;gap:12px;align-items:center}
.envtag{width:54px;height:54px;border-radius:6px;display:grid;place-items:center;color:#fff;flex:none}
.gauge{display:grid;grid-template-columns:62px 1fr 56px;gap:8px;align-items:center;font:500 12px var(--f-mono)}
.gauge span:last-child{text-align:right}
.seg{display:flex;gap:2px}
.seg i{flex:1;height:11px;background:var(--panel2);border:1px solid var(--line);min-width:0}
.seg i.on{background:var(--c,var(--acc));border-color:var(--c,var(--acc))}
.facts{display:flex;flex-wrap:wrap;gap:6px}
.fact{font:500 12px var(--f-mono);border:1px solid var(--line);padding:3px 7px;border-radius:3px}
.fact.warn{border-color:var(--acc);color:var(--acc)}
.sec{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:4px}
.sec h2{font:800 22px var(--f-disp);text-transform:uppercase;letter-spacing:.03em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.empty{border:1.5px dashed var(--line);border-radius:8px;padding:14px;color:var(--muted);font-size:13px}
.log{font:12px/1.5 var(--f-mono);color:var(--muted);display:flex;flex-direction:column;gap:2px}
.log p:first-child{color:var(--ink)}

/* cartes */
.card{position:relative;background:var(--panel);border:1.5px solid var(--kc);border-radius:8px;overflow:hidden;display:flex;flex-direction:column;min-width:0;text-align:left;color:var(--ink);padding:0;cursor:pointer;font:inherit}
.k-objet{--kc:var(--k-objet)}.k-food{--kc:var(--k-food)}.k-soin{--kc:var(--k-soin)}.k-contre{--kc:var(--k-contre)}
.k-mat{--kc:var(--k-mat)}.k-chance{--kc:var(--k-chance)}.k-locaux{--kc:var(--k-locaux)}.k-plante{--kc:var(--k-plante)}.k-visiteur{--kc:var(--k-visiteur)}.k-habitat{--kc:var(--k-habitat)}.k-pred{--kc:var(--k-pred)}.k-proie{--kc:var(--k-proie)}.k-malus{--kc:var(--k-malus)}
.card header{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:4px 8px;background:var(--kc);color:var(--on-k);font:500 11px var(--f-mono);letter-spacing:.12em}
.card .art{height:50px;display:grid;place-items:center;color:var(--kc);background:repeating-linear-gradient(135deg,transparent 0 6px,color-mix(in srgb,var(--kc) 12%,transparent) 6px 7px)}
.card .art svg{width:32px;height:32px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.card h3{font:800 21px/1 var(--f-disp);text-transform:uppercase;letter-spacing:.02em;padding:7px 8px 2px;overflow-wrap:anywhere}
.chips{display:flex;flex-wrap:wrap;gap:4px;padding:3px 8px}
.chip{font:500 12px var(--f-mono);border:1px solid var(--kc);color:var(--kc);padding:1px 5px;border-radius:3px}
.card .txt{font-size:13px;line-height:1.4;color:var(--muted);padding:2px 8px 8px}
.card .req{font:500 12px var(--f-mono);padding:5px 8px;border-top:1px dashed var(--line);margin-top:auto}
.card .req.no{color:var(--bad)}.card .req.yes{color:var(--ok)}
.pips{display:inline-flex;gap:2px}.pips i{width:6px;height:6px;background:var(--on-k);display:block}.pips i.lost{opacity:.3}
.card.sm .art,.card.sm .txt{display:none}.card.sm h3{font-size:17px}
.card.off{opacity:.6}
.card.sel{outline:3px solid var(--acc);outline-offset:1px}
.card.big{cursor:default;width:min(250px,100%);align-self:center}.card.big .art{height:70px}.card.big .art svg{width:44px;height:44px}

/* fenêtres */
.scrim{overscroll-behavior:contain;position:fixed;inset:0;background:rgba(4,10,8,.66);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet{width:min(560px,100%);max-height:92%;overflow:auto;background:var(--bg);border-top:3px solid var(--acc);padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;animation:up .22s ease-out}
.sheet h2{font:800 30px var(--f-disp);text-transform:uppercase;line-height:1}
.sheet .btns{display:flex;flex-direction:column;gap:8px}
.sheet .row{display:flex;gap:8px}
.lines{display:flex;flex-direction:column;gap:6px;font-size:14px}
.lines p{padding-left:10px;border-left:3px solid var(--acc)}
.lines p.bad{border-color:var(--bad)}.lines p.good{border-color:var(--ok)}
.verdict{font:500 12px var(--f-mono);color:var(--muted)}
.setup label{display:flex;flex-direction:column;gap:4px}
.setup input,.setup select,.setup textarea{font:16px var(--f-body);min-height:44px;border:1.5px solid var(--ink);background:var(--panel);color:var(--ink);border-radius:6px;padding:0 10px}
.stepper{display:flex;align-items:center;gap:10px}
.stepper b{font:800 34px var(--f-disp);min-width:30px;text-align:center}
.stepper .btn{flex:none;width:46px;padding:0}
.deckback{width:min(210px,70%);aspect-ratio:5/7;align-self:center;border:2px solid var(--ink);border-radius:10px;background:repeating-linear-gradient(45deg,var(--panel),var(--panel) 8px,var(--panel2) 8px 9px);display:grid;place-items:center;font:800 26px var(--f-disp);text-transform:uppercase;text-align:center;padding:12px}
.envcard{width:min(230px,70%);aspect-ratio:5/7;align-self:center;border-radius:10px;color:#fff;padding:16px;display:flex;flex-direction:column;justify-content:space-between;border:2px solid var(--ink);animation:flip .7s ease both}
.envcard h2{font-size:44px;color:#fff}
.envcard p{font-size:13px;line-height:1.35}
.rank{display:flex;gap:12px;align-items:baseline;border-bottom:1px solid var(--line);padding:8px 0}
.rank b{font:800 34px var(--f-disp);width:34px}
.envtag svg{width:34px;height:34px;fill:none;stroke:#fff;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:6px;font:500 13px var(--f-mono);z-index:80;max-width:90%;text-align:center}
.wx{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.wx>div{border:1.5px solid var(--line);border-radius:6px;padding:8px 10px;background:var(--panel);display:flex;flex-direction:column;gap:2px;min-width:0}
.wx>div:first-child{border-color:var(--ink)}
.wx b{font:800 20px var(--f-disp);text-transform:uppercase}.wx small{font-size:12px;color:var(--muted);line-height:1.3}
.ap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:48px;font:500 11px var(--f-mono);letter-spacing:.1em}
.ap b{font:800 26px var(--f-disp);line-height:1}
.bar .btn{min-width:0;padding:0 8px}
.facts button.fact{background:transparent;color:inherit;cursor:pointer;font:inherit;font-family:var(--f-mono);font-size:12px;min-height:40px}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes flip{from{transform:rotateY(90deg) scale(.9);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet,.envcard{animation:none}}
.vols{display:flex;flex-direction:column;gap:12px;margin-bottom:10px}.vol{display:flex;flex-direction:column;gap:6px}.vol input[type=range]{width:100%;min-height:36px;accent-color:var(--accent,#d9480f)}

.night{position:fixed;inset:0;z-index:70;display:flex;flex-direction:column;color:#eef2f7;background:#070b18;overflow:hidden}
.night .sky{position:relative;flex:none;height:46%;min-height:250px;overflow:hidden;background:linear-gradient(180deg,#0a1030 0%,#14204f 45%,#b4572b 100%);background-size:100% 100%}
.night .sky::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#e9a35b 0%,#c0583a 40%,#3a2a5c 75%,#070b18 100%);animation:nfade 4s ease-in forwards}
@keyframes nfade{to{opacity:0}}
.night svg{position:absolute;inset:0;width:100%;height:100%}
.night .sun{animation:nsun 3.6s ease-in forwards}
@keyframes nsun{from{transform:translateY(0)}to{transform:translateY(120px);opacity:.1}}
.night .moon{opacity:0;animation:nmoon 3.2s .8s ease-out forwards}
@keyframes nmoon{from{opacity:0;transform:translateY(60px)}to{opacity:1;transform:none}}
.night .star{opacity:0;animation:nstar 2.5s ease-in forwards,ntw 2.2s ease-in-out infinite alternate}
@keyframes nstar{from{opacity:0}to{opacity:1}}
@keyframes ntw{from{filter:brightness(.6)}to{filter:brightness(1.5)}}
.night .flame{transform-origin:50% 100%;animation:nfl .35s ease-in-out infinite alternate;opacity:0;animation-delay:2s}
.night .flame.on{opacity:1}
@keyframes nfl{from{transform:scale(1,1)}to{transform:scale(.88,1.18) skewX(4deg)}}
.night .drop{stroke:#9ab8d8;stroke-width:1.2;opacity:.6;animation:ndrop .7s linear infinite}
@keyframes ndrop{from{transform:translateY(-30px)}to{transform:translateY(300px)}}
.night .cap{position:absolute;left:0;right:0;bottom:14px;text-align:center;font:700 13px var(--f-mono,monospace);letter-spacing:.2em;text-transform:uppercase;opacity:.9}
.night .body{flex:1;overflow:auto;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;max-width:560px;width:100%;margin:0 auto}
.night h2{font:800 30px var(--f-disp);text-transform:uppercase;line-height:1;color:#fff}
.night .lines p{color:#dfe6f0;border-color:rgba(255,255,255,.18);opacity:0;transform:translateY(8px);animation:nin .5s ease-out forwards}
.night .lines p.bad{color:#ffb4a2}.night .lines p.good{color:#a8e6b8}
@keyframes nin{to{opacity:1;transform:none}}
.night .nstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;opacity:0;animation:nin .6s 2s ease-out forwards}
.night .ns{border:1px solid rgba(255,255,255,.2);border-radius:8px;padding:8px;display:flex;flex-direction:column;gap:2px}
.night .ns .mono{color:#9fb0cc;font-size:12px}.night .ns b{font:800 20px var(--f-disp);color:#fff}.night .ns i{font:600 12px var(--f-mono,monospace);font-style:normal;color:#9fb0cc}
.night .ns.good i{color:#a8e6b8}.night .ns.bad i{color:#ffb4a2}
.night .btn.pri{margin-top:auto}
@media (prefers-reduced-motion:reduce){.night *{animation-duration:.01s!important;animation-delay:0s!important}}

function dailyKey(d=new Date()){return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate()}
function dailyScenario(d=new Date()){
  const k=dailyKey(d),s=SCENARIOS[(k*7+Math.floor(k/100))%SCENARIOS.length];
  return Object.assign({},s,{id:'daily-'+k,nom:'Défi du jour : '+s.nom,daily:true});
}

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const envOf=p=>ENVS.find(e=>e.id===p.env);
const isThreat=c=>c.k==='pred'||c.k==='proie'||c.k==='malus';
const isEvent=c=>isThreat(c)||c.k==='chance'||c.k==='locaux'||c.k==='visiteur';
function mk(def){const c=JSON.parse(JSON.stringify(def));c.uid=UID++;delete c.n;if(c.dur!=null)c.max=c.dur;if(c.perish)c.age=0;return c}
const mkByName=nom=>{const c=mk(DEFS.find(d=>d.nom===nom));c.tmp=true;return c};
function buildDeck(){const d=[],D=DIFF[G.diff];DEFS.forEach(def=>{for(let i=0;i<(def.n||0);i++){if(def.k==='chance'&&RF()>D.chance)continue;const c=mk(def);if(c.k==='pred')c.power+=D.pw;d.push(c)}});return shuffle(d)}
/* météo : tirée au hasard, ou déterminée par la graine pour le défi du jour */
const pickWx=env=>{const t=WX_TABLE[env];if(G&&G.seed){G.wxN=(G.wxN||0)+1;return t[Math.floor(mulberry32(G.seed*7919+G.wxN)()*t.length)]}return t[rnd(t.length)]};

function mkPlayer(spec,i){

    wx:'clair',wxNext:'clair',started:false,notes:[],vivant:true,mort:null,cause:'',st:{},dmg:{},recettes:[]};
}
function newGame(noms,jours,diff,scn){
  UID=1;

  const spec0=noms[0],spec=typeof spec0==='string'?{nom:spec0}:spec0;
  const seed=scn&&scn.daily?(+String(scn.id).slice(6)||0):0;
  RF=seed?mulberry32(seed):Math.random;
  {
    G={id:Date.now().toString(36)+Math.floor(Math.random()*1e4).toString(36),v:SAVE_V,made:Date.now(),scn:scn||null,seed,wxN:0,s0:rnd(4),journal:[],watch:false,jours,diff:diff||2,jour:1,cur:0,over:false,rescue:null,rescued:false,signal:0,solo:true,deck:[],disc:[],envDeck:[],log:[],
       players:[mkPlayer(spec,0)]};
    G.deck=buildDeck();
    {const def=DEFS.find(d=>d.nom==='Parchemin de recettes');if(def){const sc=mk(def),k=Math.min(G.deck.length,14+rnd(20));G.deck.splice(G.deck.length-k,0,sc)}}

function log(t){G.log.unshift(t);if(G.log.length>40)G.log.pop()}
const pvMax=p=>8+2*p.hab;
function drawEnv(p){
  if(!G.envDeck.length)G.envDeck=shuffle(ENVS.map(e=>e.id));
  p.env=(G.scn&&G.scn.env)||G.forceEnv||G.envDeck.pop();return envOf(p);
}
function startPlayer(p){
  p.inv=[mkByName(envOf(p).kit)];
  while(p.hand.length<5){const c=G.deck.pop();if(!c)break;if(isEvent(c)||c.k==='contre'&&p.hand.length<2||(c.biomes&&!c.biomes.includes(p.env))){G.disc.push(c);continue}p.hand.push(c)}
  const D=DIFF[G.diff];p.pv=Math.max(3,pvMax(p)+D.pv);p.sat=7+D.start;p.eau=7+D.start;p.ene=8+Math.min(0,D.start);p.moral=7;p.goals={};initKg(p,p.kgPref);initHuman(p);
  p.wx=pickWx(p.env);p.wxNext=pickWx(p.env);

/* ----- capacités calculées ----- */
function tagList(p){const t=[];p.inv.forEach(c=>(c.tags||[]).forEach(x=>t.push(x)));if(p.hab>=1)t.push('abri');if(p.hab>=2)t.push('solide');if(p.hab>=3||p.foyer>0)t.push('feu','foyer');return t}
const has=(p,t)=>tagList(p).includes(t);
const sumInv=(p,k)=>p.inv.reduce((s,c)=>s+(c[k]||0),0);
const ATK=p=>sumInv(p,'atk');
const DEF=p=>sumInv(p,'def')+p.hab;
const RES=(p,t)=>p.inv.reduce((s,c)=>s+((c.res&&c.res[t])||0),0);
const seasonStress=p=>seasonFx(p).st+(G.jours?0:Math.min(2,Math.floor((G.jour-1)/(SEASON_LEN*4))));
const stressNight=p=>{const e=envOf(p);return Math.max(0,e.niv+WX[p.wx].st+DIFF[G.diff].st+seasonStress(p)-RES(p,e.stress)-p.hab-(p.fort||0)-(p.garde&&has(p,'feu')?1:0)-(typeof skl==='function'&&skl(p,'abri')>=2?1:0))};
const missing=(p,req)=>(req||[]).filter(t=>!has(p,t));
const matCount=(p,nom)=>p.hand.filter(c=>c.k==='mat'&&c.nom===nom).length;
const removeFrom=(arr,c)=>{const i=arr.indexOf(c);if(i>=0)arr.splice(i,1)};
function wear(p,c,n=1){if(c.dur==null)return false;{const w=n*DIFF[G.diff].wear;c.dur-=Math.floor(w)+(rnd(100)<(w%1)*100?1:0)}   /* usure entière, fraction tirée au sort */
  if(c.dur<=0){removeFrom(p.inv,c);G.disc.push(c);return true}return false}
const wearTag=(p,tag)=>{if(tag==='feu'&&p.foyer>0)return;   /* un foyer entretenu s'use à la place de l'outil */
  const c=p.inv.find(x=>(x.tags||[]).includes(tag));if(c){if(tag==='feu'&&typeof skl==='function'&&rnd(100)<skl(p,'feu')*7)return;wear(p,c,1)}};
function die(p,cause){if(!p.vivant)return;p.vivant=false;p.mort=G.jour;p.cause=cause;G.disc.push(...p.hand,...p.inv,...p.cache);p.hand=[];p.inv=[];p.cache=[];logj(`${p.nom} succombe (${cause}).`,p,'bad');G.players.forEach(o=>{if(o.vivant)mor(o,-2)});typeof fx==='function'&&fx('death')}
function hurt(p,n,cause){if(n<=0)return;p.dmg=p.dmg||{};p.dmg[cause||'blessures']=(p.dmg[cause||'blessures']||0)+n;p.pv-=n;typeof fx==='function'&&fx('hurt');if(p.pv<=0){p.pv=0;die(p,cause||'blessures')}}
function addCond(p,c,out){if(p.cond.includes(c)){p.cd[c]=COND_DAYS[c];return}p.cond.push(c);p.cd[c]=COND_DAYS[c];out&&out.push(`${COND_LABEL[c]} : ${COND_TXT[c]}`)}
function cure(p,list,out){(list||[]).forEach(c=>{const i=p.cond.indexOf(c);if(i>=0){p.cond.splice(i,1);delete p.cd[c];out&&out.push(`${COND_LABEL[c]} soigné.`)}})}
const gain=(p,nom,n,out)=>{for(let i=0;i<n;i++)p.hand.push(mkByName(nom));out&&out.push(`+${n} ${nom}.`)};

/* ----- points d'action ----- */
function calcAP(p){
  let a=AP_BASE+DIFF[G.diff].ap+WX[p.wx].ap;
  if(p.ene<6)a-=p.ene>=3?1:p.ene>=1?2:3;
  if(p.cond.includes('fracture'))a--;
  if(MORAL(p)<=2)a--;
  if(kgPct(p)<=-.2)a--;
  a+=humanAP(p);
  return Math.max(1,a);
}
const apCost=(p,act)=>act==='explore'?1+WX[p.wx].expl:AP_COST[act];
const spend=(p,n)=>{p.ap=Math.max(0,p.ap-n)};
const apOk=(p,act)=>p.ap>=apCost(p,act)?{ok:true}:{ok:false,why:`Il faut ${apCost(p,act)} point(s) d'action.`};
function startDay(p){
  p.started=true;p.ap=p.apMax=calcAP(p);const out=[];
  if(WX[p.wx].rain&&has(p,'récipient')){p.eau=Math.min(EAU_MAX,p.eau+3);out.push({t:'Récipients pleins de pluie : eau +3.',c:'good'})}
  if(typeof humanMorning==='function')humanMorning(p,out);
  return out;
}

/* ----- pioche ----- */
function draw(p){
  for(let t=0;t<60;t++){
    if(!G.deck.length){if(!G.disc.length)return null;G.deck=shuffle(G.disc.filter(x=>!x.tmp));G.disc=[]}
    const c=G.deck.pop();
    if(c.biomes&&!c.biomes.includes(p.env)){G.disc.push(c);continue}
    return c;
  }
  return null;
}

/* ----- jouer une carte ----- */
function canPlay(p,c){
  if(c.k==='mat')return{ok:false,why:'Sert à fabriquer, réparer ou alimenter le signal (menu Actions).'};
  if(c.k==='contre'){
    if(c.cure&&c.cure.some(x=>p.cond.includes(x)))return{ok:true};
    return{ok:false,why:'Se joue en réaction à un aléa, au moment où il frappe.'};
  }
  if(c.k==='objet')return p.inv.length>=INV_MAX?{ok:false,why:`Inventaire plein (${INV_MAX} objets max).`}:{ok:true};
  const m=missing(p,c.req);
  if(m.length)return{ok:false,why:'Il vous manque : '+m.join(', ')+'.'};
  if(c.k==='soin'){
    const useful=(c.pv&&p.pv<pvMax(p))||(c.ene&&p.ene<ENE_MAX)||(c.moral&&MORAL(p)<10)||(c.cure||[]).some(x=>p.cond.includes(x));
    if(!useful)return{ok:false,why:'Rien à soigner pour l\'instant.'};
  }
  if(c.k==='plante'){return p.sat<SAT_MAX?{ok:true}:{ok:false,why:'Ingrédient : à préparer en remède (menu Actions). Mâchée crue, elle cale à peine.'}}
  if(c.k==='food'){
    const useful=(c.sat&&p.sat<SAT_MAX)||(c.eau&&p.eau<EAU_MAX);
    if(!useful)return{ok:false,why:'Vous n\'en avez pas besoin maintenant.'};
  }
  if(c.k==='habitat'){
    if(p.hab>=c.lvl)return{ok:false,why:'Vous avez déjà ce niveau d\'habitat ou mieux.'};
    if(p.hab<c.need)return{ok:false,why:'Il faut d\'abord : '+HAB_NAMES[c.need]+'.'};
    if(p.hand.length-1<c.cost)return{ok:false,why:`Il faut ${c.cost} autre(s) carte(s) à défausser.`};
    if(p.ap<AP_COST.habitat)return{ok:false,why:`Construire coûte ${AP_COST.habitat} points d'action.`};
  }
  return{ok:true};
}
function play(p,c,discards){
  removeFrom(p.hand,c);const out=[];
  if(c.k==='objet'){p.inv.push(c);out.push(`${c.nom} équipé.`);return out}
  if(c.k==='contre'){cure(p,c.cure,out);G.disc.push(c);return out}
  if((c.req||[]).includes('feu'))wearTag(p,'feu');
  if(c.k==='food'){
    const bits=[];
    if(c.sat){p.sat=Math.min(SAT_MAX,p.sat+c.sat);bits.push(`faim +${c.sat}`)}
    if(c.eau){p.eau=Math.min(EAU_MAX,p.eau+c.eau);bits.push(`eau +${c.eau}`)}
    if(c.pv){p.pv=Math.min(pvMax(p),p.pv+c.pv);bits.push(`santé +${c.pv}`)}
    out.push(`${c.nom} : ${bits.join(', ')}.`);
  }
  if(c.k==='plante'){p.sat=Math.min(SAT_MAX,p.sat+1);out.push(`${c.nom} mâché : amer, faim +1.`)}
  if(c.k==='soin'){if(c.pv)p.pv=Math.min(pvMax(p),p.pv+c.pv);if(c.ene)p.ene=Math.min(ENE_MAX,p.ene+c.ene);if(c.moral)mor(p,c.moral);cure(p,c.cure,out);out.push(`${c.nom} utilisé.`);cnt(p,'soins');train(p,'soins',.2);if(skl(p,'soins')>=3&&c.pv&&p.pv<pvMax(p)){p.pv++;out.push('Geste précis : santé +1.')}}
  if(c.k==='habitat'){
    spend(p,AP_COST.habitat);
    (discards||[]).forEach(u=>{const x=p.hand.find(h=>h.uid===u);if(x){removeFrom(p.hand,x);G.disc.push(x)}});
    p.hab=c.lvl;p.pv=Math.min(pvMax(p),p.pv+2);out.push(`${HAB_NAMES[c.lvl]} construit : santé max ${pvMax(p)}.`);
  }
  G.disc.push(c);log(`${p.nom} : ${out[0]}`);return out;
}

/* ----- menaces ----- */
function counters(p,t){
  const tags=t.k==='pred'?t.repel:t.counter,found=[];
  (tags||[]).forEach(tag=>{
    if((tag==='abri'&&p.hab>=1)||(tag==='solide'&&p.hab>=2)||(tag==='feu'&&p.hab>=3))found.push({tag,where:'hab',rank:0,label:HAB_NAMES[p.hab]});
    const i=p.inv.find(c=>(c.tags||[]).includes(tag));if(i)found.push({tag,card:i,where:'inv',rank:1,label:i.nom});
    const h=p.hand.find(c=>c.k!=='objet'&&c.k!=='mat'&&c.k!=='habitat'&&(c.tags||[]).includes(tag));if(h)found.push({tag,card:h,where:'hand',rank:2,label:h.nom+' (consommé)'});
  });
  return found.sort((a,b)=>a.rank-b.rank)[0]||null;
}
function catcher(p,t){for(const tag of t.catch){const c=p.inv.find(x=>(x.tags||[]).includes(tag));if(c)return c}return null}
function threatInfo(p,t){
  const info={counter:counters(p,t)};
  if(t.k==='pred'){info.atk=ATK(p);info.def=DEF(p);info.win=info.atk>=t.power;info.dmgFail=Math.max(1,t.power-info.def);info.dmgEndure=Math.max(0,t.power-info.def)}
  if(t.k==='proie')info.tool=catcher(p,t);
  return info;
}
function useCounter(p,m){
  if(m.where==='inv')wear(p,m.card,1);
  if(m.where==='hand'){removeFrom(p.hand,m.card);G.disc.push(m.card)}
}
function resolve(p,t,ch){
  const out=[];let tone='';
  if(t.k==='pred'){
    if(ch==='counter'){const m=counters(p,t);useCounter(p,m);out.push(`${t.nom} recule : ${m.label}.`);tone='good'}
    else if(ch==='fight'){
      const a=ATK(p);p.inv.filter(c=>c.atk>0&&c.dur!=null).forEach(c=>wear(p,c,1));
      if(a>=t.power){cnt(p,'fightWin');out.push(`Vous terrassez ${t.nom}.`);gain(p,'Gibier',1,out);gain(p,'Peau',1,out);tone='good'}
      else{cnt(p,'fightLose');const d=Math.max(1,t.power-DEF(p));out.push(`${t.nom} vous blesse : −${d} PV.`);if(d>=3)addCond(p,'saignement',out);hurt(p,d,t.nom);tone='bad'}
    }else{
      const d=Math.max(0,t.power-DEF(p));
      out.push(d?`Vous encaissez ${t.nom} : −${d} PV.`:`Votre défense tient. ${t.nom} s'en va.`);
      if(d>=3)addCond(p,'saignement',out);hurt(p,d,t.nom);tone=d?'bad':'good';
    }
  }
  if(t.k==='proie'){
    if(ch==='hunt'){const c=catcher(p,t);wear(p,c,1);out.push(`${t.nom} pris avec ${c.nom}.`);gain(p,t.loot,t.lootN,out);if(t.extra)gain(p,t.extra,1,out);tone='good'}
    else out.push(`${t.nom} file dans les broussailles.`);
  }
  if(t.k==='malus'){
    if(ch==='counter'){const m=counters(p,t);useCounter(p,m);out.push(`${t.nom} contré : ${m.label}.`);tone='good'}
    else{
      const e=t.eff;tone='bad';
      if(e.pv)out.push(`${t.nom} : −${-e.pv} PV.`);
      if(e.sat){p.sat=Math.max(0,p.sat+e.sat);out.push(`Faim ${e.sat}.`)}
      if(e.eau){p.eau=Math.max(0,p.eau+e.eau);out.push(`Eau ${e.eau}.`)}
      if(e.ene){p.ene=clamp(p.ene+e.ene,0,ENE_MAX);out.push(`Énergie ${e.ene}.`)}
      if(e.cond)addCond(p,e.cond,out);
      if(e.lose==='hand'&&p.hand.length){const c=p.hand[rnd(p.hand.length)];removeFrom(p.hand,c);G.disc.push(c);out.push(`Perdu : ${c.nom}.`)}
      if(e.lose==='food'){const f=p.hand.filter(c=>c.k==='food');if(f.length){const c=f[rnd(f.length)];removeFrom(p.hand,c);G.disc.push(c);out.push(`Vivres perdus : ${c.nom}.`)}}
      if(e.lose==='equip'&&p.inv.length){const c=p.inv[rnd(p.inv.length)];removeFrom(p.inv,c);G.disc.push(c);out.push(`Emporté : ${c.nom}.`)}
      if(e.pv)hurt(p,-e.pv,t.nom);
    }
  }
  G.disc.push(t);log(`${p.nom} : ${out[0]}`);
  return{lines:out,tone,dead:!p.vivant};
}
function resolveChance(p,c){
  const e=c.eff,out=[];
  if(e.eau){p.eau=Math.min(EAU_MAX,p.eau+e.eau);out.push(`Eau +${e.eau}.`)}
  if(e.sat){p.sat=Math.min(SAT_MAX,p.sat+e.sat);out.push(`Faim +${e.sat}.`)}
  if(e.ene){p.ene=Math.min(ENE_MAX,p.ene+e.ene);out.push(`Énergie +${e.ene}.`)}
  if(e.pv){p.pv=Math.min(pvMax(p),p.pv+e.pv);out.push(`Santé +${e.pv}.`)}
  if(e.moral){mor(p,e.moral);out.push(`Moral +${e.moral}.`)}
  if(e.recette){if(!learnRemedy(p,out)){mor(p,1);out.push('Vous connaissez déjà toutes les recettes. Moral +1.')}else out.unshift('Vous trouvez un parchemin de recettes.')}
  if(e.gain){const cnt={};e.gain.forEach(n=>cnt[n]=(cnt[n]||0)+1);for(const n in cnt)gain(p,n,cnt[n],out)}
  G.disc.push(c);log(`${p.nom} : ${c.nom}.`);
  return out;
}
/* ---------- Moteur : actions, nuit, Habitants, tours ---------- */

/* ----- actions du jour ----- */
function waterYield(p){
  const rain=WX[p.wx].rain,rec=has(p,'récipient');let n=0,warn='';
  switch(p.env){
    case 'foret':n=3;break;
    case 'marais':n=3;if(!has(p,'feu'))warn='non bouillie : risque d\'infection';break;
    case 'montagne':n=2+(rec?1:0);break;
    case 'glacier':n=has(p,'feu')?3:1;if(!has(p,'feu'))warn='sans feu, la neige vous glace';break;
    case 'ocean':n=rec?1:0;break;
    case 'desert':n=has(p,'couteau')?2:0;break;
    case 'jungle':n=3;if(!has(p,'feu'))warn='non bouillie : risque de gastro et d\'infection';break;
    case 'savane':n=has(p,'couteau')?2:1;if(!has(p,'feu'))warn='mare souillée : risque de gastro';break;
    case 'steppe':n=2;if(!has(p,'feu'))warn='risque de gastro';break;
    case 'canyon':n=has(p,'couteau')?2:0;break;
    case 'fjord':n=3;break;
  }
  if(n>0&&skl(p,'eau')>=3)n++;
  if(rain&&rec)n+=2;
  return{n,warn};
}
function collectYield(p,w){
  if(w==='Eau')return waterYield(p).n;
  if(w==='Vivres')return clamp(Math.round((envOf(p).forage.p+(has(p,'couteau')?.1:0))*100)+seasonFx(p).food+skl(p,'nourriture')*4,5,95);
  const y=envOf(p).yield[w];return y>0&&w==='Bois'&&has(p,'hache')?y+1:y;
}
function doCollect(p,w){
  spend(p,AP_COST.collect);cnt(p,'collect');const out=[];let tone='good';
  if(w==='Eau'){
    const y=waterYield(p);p.eau=Math.min(EAU_MAX,p.eau+y.n);out.push(`Eau +${y.n}.`);
    if(y.n>0&&p.env!=='glacier'&&p.env!=='ocean'&&p.env!=='montagne'&&rawWaterRisk(p,out))tone='bad';
    train(p,'eau',.12);
    if(p.env==='glacier'&&!has(p,'feu')){p.ene=Math.max(0,p.ene-1);out.push('Énergie −1 (froid).')}
  }else if(w==='Vivres'){
    const e=envOf(p);
    train(p,'nourriture',.12);
    if(rnd(100)<collectYield(p,'Vivres')){const nom=e.forage.list[rnd(e.forage.list.length)];gain(p,nom,1,out);if((e.id==='foret'||e.id==='marais')&&has(p,'outil')&&rnd(100)<40)gain(p,e.forage.list[rnd(e.forage.list.length)],1,out)}
    else{out.push('Vous ratissez le secteur sans rien trouver.');tone='bad'}
  }else if(w==='Plantes'){tone=harvestPlants(p,out)}
  else{gain(p,w,collectYield(p,w),out)}
  log(`${p.nom} : ${out[0]}`);return{lines:out,tone};
}
function doRest(p){
  spend(p,AP_COST.rest);cnt(p,'rest');p.ene=Math.min(ENE_MAX,p.ene+2);const out=['Énergie +2.'];
  if(p.hab>=1&&p.pv<pvMax(p)){p.pv++;out.push('À l\'abri : santé +1.')}
  return{lines:out,tone:'good'};
}
function canCraft(p,r){
  const need=[];
  if(r.not&&r.not.includes(p.env))return{ok:false,need:[],tools:[],env:true};
  for(const m in r.mats){if(matCount(p,m)<r.mats[m])need.push(`${r.mats[m]-matCount(p,m)} ${m}`)}
  const tm=missing(p,r.tools);
  return{ok:!need.length&&!tm.length,need,tools:tm};
}
function doCraft(p,r){
  spend(p,AP_COST.craft);cnt(p,'craft');
  for(const m in r.mats){for(let i=0;i<r.mats[m];i++){const c=p.hand.find(x=>x.k==='mat'&&x.nom===m);removeFrom(p.hand,c);G.disc.push(c)}}

function localOdds(p,approach,gift){
  let al=20+p.rep*7,ho=35-p.rep*7;const g=gift?giftValue(gift):0;
  if(approach==='ouvert'){al+=5;ho-=5}
  if(approach==='present'){al+=10+g*8;ho-=8+g*5}

  if(p.pact){al+=25;ho-=20}
  al=clamp(al,5,85);ho+=DIFF[G.diff].loc;ho=clamp(ho,5,75);
  if(al+ho>95){const k=95/(al+ho);al*=k;ho*=k}
  return{al,ho};
}
const LOC_ALLY=['Ils vous font signe de les suivre jusqu\'à leur feu. On vous donne à boire avant de vous poser une seule question.',

const handMax=p=>HAND_MAX+(has(p,'sac')?2:0);
/* Cache : réserve hors de la main, à l'abri des vols et pillages. Plus l'habitat est solide, plus elle contient. Rien de périssable. */
/* ----- foyer entretenu : braises qui durent plusieurs nuits, usure de l'outil évitée ----- */
const FIRE_TOOL=p=>p.inv.find(c=>(c.tags||[]).includes('feu'));
function canFoyer(p){
  if(p.hab>=3)return{ok:false,why:'Le foyer permanent du refuge suffit.'};
  if(p.foyer>=3)return{ok:false,why:'Foyer déjà plein (3/3).'};
  if(!FIRE_TOOL(p))return{ok:false,why:'Il faut un outil à feu en jeu (Briquet, Pierre à feu, Torche…).'};
  if(matCount(p,'Bois')<1)return{ok:false,why:'Il faut 1 Bois en main.'};
  return{ok:true};
}
function doFoyer(p){
  spend(p,AP_COST.foyer);const m=p.hand.find(x=>x.k==='mat'&&x.nom==='Bois');removeFrom(p.hand,m);G.disc.push(m);
  const was=p.foyer||0;p.foyer=3;cnt(p,'foyer');train(p,'feu',.2);
  return{lines:[was?`Le foyer est ravivé (3/3).`:`Le foyer brûle (3/3).`,'Tant qu\'il vit : fuit des bêtes, réchauffe, compte comme feu pour fabriquer et signaler, et n\'use plus votre outil.'],tone:'good'};
}
/* ----- affût : pêche ou chasse immédiate, avec le bon outil ----- */
const FISH_ENVS=['ocean','marais','jungle','fjord','glacier'];
function affutInfo(p,mode){
  const tool=mode==='peche'?p.inv.find(c=>(c.tags||[]).includes('canne')):p.inv.find(c=>(c.tags||[]).includes('arme'));
  if(!tool)return{ok:false,why:mode==='peche'?'Il faut une canne ou un filet en jeu.':'Il faut un arc ou une lance en jeu.'};
  if(mode==='peche'&&!FISH_ENVS.includes(p.env))return{ok:false,why:'Pas de poisson à pêcher ici.'};
  if(p.ene<2)return{ok:false,why:'Trop fatigué pour rester immobile (énergie 2 minimum).'};
  let ch=(p.env==='desert'||p.env==='glacier'?38:56)+skl(p,'nourriture')*6+((tool.tags||[]).includes('arc')?8:0)+(mode==='peche'&&p.wx==='pluie'?8:0)-(['orage','sable','blizzard'].includes(p.wx)?18:0);
  ch=Math.max(15,Math.min(90,ch));
  return{ok:true,tool,ch};
}
function doAffut(p,mode){
  const info=affutInfo(p,mode),what=mode==='peche'?'Poisson':'Gibier';
  spend(p,AP_COST.affut);p.ene=Math.max(0,p.ene-1);cnt(p,'affut');train(p,'nourriture',.12);
  const out=[];let tone='';
  if(rnd(100)<info.ch){
    if(mode==='chasse'&&rnd(100)<(info.tool.tags.includes('arc')?18:26)){
      /* touchée mais pas abattue */
      if(wear(p,info.tool,1))out.push(`${info.tool.nom} est hors d'usage.`);
      out.push('Énergie −1.');
      return{lines:['Touchée, mais pas abattue : la bête se retourne !'].concat(out),tone:'bad',wounded:woundedPower()};
    }
    let n=1;if(skl(p,'nourriture')>=3&&rnd(100)<25)n=2;
    gain(p,what,n);out.push(`${what} ×${n} : l'attente a payé.`);tone='good';
  }else out.push(mode==='peche'?'Rien ne mord. Le fil reste mou.':'Rien ne bouge. La piste est vide.');
  if(wear(p,info.tool,1))out.push(`${info.tool.nom} est hors d'usage.`);
  out.push('Énergie −1.');
  return{lines:out,tone};
}
/* ----- fumage : le Fumoir traite d'un coup toutes les prises fraîches (4 au plus), pour un meilleur résultat que le séchage ----- */
const SMOKE_MAP={'Poisson':'Poisson fumé','Gibier':'Gibier fumé'};
const smokeable=p=>p.hand.filter(c=>SMOKE_MAP[c.nom]).slice(0,4);
function canSmoke(p){
  const f=p.inv.find(c=>(c.tags||[]).includes('fumoir'));
  if(!f)return{ok:false,why:'Il faut un Fumoir en jeu (Fabriquer : 2 Bois, 1 Pierre, feu).'};
  if(!has(p,'feu'))return{ok:false,why:'Il faut du feu (#feu) ou un foyer entretenu.'};
  if(!smokeable(p).length)return{ok:false,why:'Aucun Poisson ni Gibier frais en main.'};
  return{ok:true,tool:f};
}
function doSmoke(p){
  const c=canSmoke(p),cards=smokeable(p);
  spend(p,AP_COST.smoke);wearTag(p,'feu');
  const out=[];cards.forEach(x=>{removeFrom(p.hand,x);G.disc.push(x);const n=mkByName(SMOKE_MAP[x.nom]);p.hand.push(n);out.push(`${x.nom} → ${n.nom}.`)});
  if(wear(p,c.tool,1))out.push(`${c.tool.nom} est hors d'usage.`);
  cnt(p,'smoke');train(p,'nourriture',.2);train(p,'feu',.1);
  out.push('Ça se garde : plus de pourriture.');
  return{lines:out,tone:'good'};
}
/* ----- chasse qui tourne mal : bête blessée qui revient sur vous ----- */
function woundedPower(){return 2+rnd(3)+(G.diff>=4?1:0)}
function resolveWounded(p,power,choice){
  const out=[];let tone='';
  if(choice==='flee'){
    p.peur=Math.min(10,p.peur+1);out.push('Vous lâchez prise et reculez. La bête disparaît avec votre prise. Peur +1.');return{lines:out,tone:'bad'};
  }
  const a=ATK(p)+rnd(3);
  p.inv.filter(c=>c.atk>0&&c.dur!=null).forEach(c=>wear(p,c,1));
  if(a>=power){cnt(p,'fightWin');out.push('Vous l\'achevez avant qu\'elle ne vous touche.');gain(p,'Gibier',1,out);if(rnd(2))gain(p,'Peau',1,out);tone='good'}
  else if(a===power-1){const d=Math.max(0,power-1-DEF(p));out.push(d?`Vous l'achevez, mais elle vous griffe : −${d} PV.`:'Vous l\'achevez de justesse, sans une égratignure.');gain(p,'Gibier',1,out);if(d){hurt(p,d,'bête blessée');if(d>=3)addCond(p,'saignement',out)}tone=d?'bad':'good'}
  else{const d=Math.max(1,power-DEF(p));cnt(p,'fightLose');out.push(`Elle vous charge et s'échappe : −${d} PV.`);hurt(p,d,'bête blessée');if(p.vivant&&d>=3)addCond(p,'saignement',out);tone='bad'}
  return{lines:out,tone};
}
const FORT_MATS=['Bois','Pierre','Fibres'];
const fortMats=p=>p.hand.filter(c=>c.k==='mat'&&FORT_MATS.includes(c.nom));
function canFort(p){
  if(p.hab<1)return{ok:false,why:'Il faut déjà un abri (habitat 1 ou plus).'};
  if((p.fort||0)>=2)return{ok:false,why:'Renfort au maximum (2/2).'};
  if(fortMats(p).length<2)return{ok:false,why:'Il faut 2 matériaux en main (Bois, Pierre ou Fibres).'};
  return{ok:true};
}
function doFort(p){
  spend(p,AP_COST.fort);
  for(let i=0;i<2;i++){const m=cheapestMat({hand:fortMats(p)});removeFrom(p.hand,m);G.disc.push(m)}
  p.fort=(p.fort||0)+1;cnt(p,'fort');train(p,'abri',.15);
  return{lines:[`L'abri est renforcé : stress de la nuit −1 en plus (renfort ${p.fort}/2). Une tempête peut l'abîmer.`],tone:'good'};
}
function canGarde(p){
  if(p.garde)return{ok:false,why:'Veille déjà prévue cette nuit.'};
  if(p.ene<4)return{ok:false,why:'Trop fatigué pour veiller (énergie 4 minimum).'};
  return{ok:true};
}
function doGarde(p){
  spend(p,AP_COST.garde);p.garde=true;
  return{lines:[`Vous veillerez cette nuit : aucune surprise nocturne${has(p,'feu')?', et le feu entretenu réduit le stress de la nuit de 1':''}. Coût : énergie −2 au matin${has(p,'feu')?' et un peu d\'usure du feu':''}.`],tone:'good'};
}
const cacheMax=p=>2+(p.hab||0);
const cacheable=c=>c.k!=='contre'&&!c.perish;
const cacheCards=p=>p.hand.filter(cacheable);
function doStash(p,c){
  spend(p,AP_COST.stash);removeFrom(p.hand,c);p.cache.push(c);cnt(p,'stash');
  return{lines:[`${c.nom} est caché : il ne sera ni volé ni emporté.`],tone:'good'};
}
function doTakeCache(p,c){
  if(p.hand.length>=handMax(p))return{ok:false,why:`Main pleine (${handMax(p)} cartes). Libérez une place.`};
  removeFrom(p.cache,c);p.hand.push(c);return{ok:true};
}
const cnt=(p,k,n=1)=>{p.st=p.st||{};p.st[k]=(p.st[k]||0)+n};
const fmtKg=v=>v.toFixed(1).replace('.',',');
const fmtD=d=>(d>0?'+':d<0?'−':'±')+Math.abs(d).toFixed(1).replace('.',',');

/* ----- poids ----- */
function initKg(p,kg){
  const v=kg&&kg>=35&&kg<=200?kg:Math.round((55+rnd(41)+Math.random())*10)/10;
  p.kg0=p.kg=Math.round(v*10)/10;p.kgD=0;p.kgH=[{j:1,kg:p.kg}];
}
const kgPct=p=>p.kg0?(p.kg-p.kg0)/p.kg0:0;
function weightNight(p,used){
  let d=-0.15;
  d+=p.sat>=8?.45:p.sat>=6?.2:p.sat>=4?-.05:p.sat>=2?-.4:-.9;
  if(p.eau<=2)d-=.35;else if(p.eau>=7)d+=.05;
  if(used>=5)d-=.1;
  if(p.cond.length)d-=.1;
  d+=(rnd(3)-1)/10;
  d=Math.round(d*10)/10;
  p.kg=Math.max(30,Math.round((p.kg+d)*10)/10);p.kgD=d;
  p.kgH.push({j:G.jour+1,kg:p.kg});
  return d;
}
function weightState(p){
  const pc=kgPct(p);
  return pc<=-.2?{n:2,t:'Très amaigri : −1 PA et sommeil moins réparateur.'}:pc<=-.1?{n:1,t:'Amaigri : le sommeil répare moins.'}:pc>=.05?{n:-1,t:'Bien en chair : vous tenez mieux.'}:{n:0,t:'Poids stable.'};
}

/* ----- plantes et remèdes ----- */
const plantsOf=p=>p.hand.filter(c=>c.k==='plante');
const knownRem=p=>p.recettes||(p.recettes=[]);
const plantList=env=>DEFS.filter(d=>d.k==='plante'&&d.biomes.includes(env));
const plantChance=p=>clamp(({foret:80,marais:70,montagne:60,ocean:45,desert:35,glacier:30,jungle:80,savane:40,steppe:40,canyon:30,fjord:60})[p.env]+Math.round(seasonFx(p).food/2)+(has(p,'outil')?10:0),10,92);
function harvestPlants(p,out){
  cnt(p,'harvest');
  if(rnd(100)<plantChance(p)){
    const l=plantList(p.env),d=l[rnd(l.length)];gain(p,d.nom,1,out);
    if(has(p,'outil')&&rnd(100)<35){const d2=l[rnd(l.length)];gain(p,d2.nom,1,out)}
    return 'good';
  }
  out.push('Vous cherchez en vain les bonnes plantes.');return 'bad';
}
function pickPlants(p,r){
  const used=new Set(),res=[];
  for(const [tag,n] of r.need)for(let i=0;i<n;i++){
    const c=plantsOf(p).find(x=>!used.has(x.uid)&&x.vertus.includes(tag));if(!c)return null;used.add(c.uid);res.push(c);
  }
  return res;
}
function canBrew(p,r){
  if(!knownRem(p).includes(r.id))return{ok:false,why:'Recette inconnue : un visiteur ou les Habitants peuvent vous l\'apprendre.'};
  const m=missing(p,r.tools);if(m.length)return{ok:false,why:'Il vous manque : '+m.join(', ')+'.'};
  if(!pickPlants(p,r))return{ok:false,why:'Il vous manque des plantes : '+r.txt+'.'};
  return{ok:true};
}
function doBrew(p,r){
  spend(p,AP_COST.craft);const pl=pickPlants(p,r);
  pl.forEach(c=>{removeFrom(p.hand,c);G.disc.push(c)});
  if(r.tools.includes('feu'))wearTag(p,'feu');
  const c=mkByName(r.out);p.hand.push(c);cnt(p,'brew');
  logj(`${p.nom} prépare : ${c.nom}.`,p);
  return{lines:[`${c.nom} préparé (dans votre main).`],tone:'good'};
}
function learnRemedy(p,out){
  const unk=REMEDES.filter(r=>!knownRem(p).includes(r.id));
  if(!unk.length)return false;
  const r=unk[rnd(unk.length)];knownRem(p).push(r.id);
  out.push(`Recette apprise : ${r.out} (${r.txt}).`);jr(`Recette apprise : ${r.out}.`,p,'good');cnt(p,'recipes');
  return true;
}

/* ----- visiteurs ----- */
function visitorResolve(p,v,choice,gift){
  {const R=visitorExtra(p,v,choice,gift);if(R)return R}
  const out=[];let tone='good';cnt(p,'visitors');
  if(gift){removeFrom(p.hand,gift);G.disc.push(gift)}
  const nice=gift&&['food','plante','soin'].includes(gift.k);
  const stealOne=()=>{
    if(!p.hand.length)return false;
    const c=p.hand[rnd(p.hand.length)];removeFrom(p.hand,c);G.disc.push(c);out.push(`Il disparaît avec ${c.nom}.`);tone='bad';return true;
  };
  if(v.id==='herboriste'){
    if(choice==='away')out.push('Il hausse les épaules et reprend sa route.');
    else if(rnd(100)<(nice?90:65)){
      if(learnRemedy(p,out))gain(p,plantList(p.env)[0].nom,1,out);
      else{out.push('Vous connaissez déjà tout ce qu\'il sait.');const l=plantList(p.env);gain(p,l[rnd(l.length)].nom,2,out)}
    }else{out.push('Il garde son savoir pour lui, mais vous laisse une poignée de plantes.');const l=plantList(p.env);gain(p,l[rnd(l.length)].nom,1,out)}
  }else if(v.id==='marchand'){
    if(choice==='away')out.push('Il remballe sa carriole sans insister.');
    else if(choice==='trade'){const m=['Bois','Pierre','Fibres','Peau'];gain(p,m[rnd(4)],1,out);gain(p,m[rnd(4)],1,out);if(rnd(100)<35)gain(p,'Bandage',1,out)}
    else{gain(p,['Bois','Pierre','Fibres'][rnd(3)],1,out);if(rnd(100)<35)gain(p,'Eau potable',1,out)}
  }else if(v.id==='voyageur'){
    if(choice==='away')out.push('Il s\'éloigne en boitant.');
    else{p.eau=Math.min(EAU_MAX,p.eau+(choice==='meal'?3:1));mor(p,2);out.push(`Il partage ses nouvelles et sa gourde : moral +2, eau +${choice==='meal'?3:1}.`);if(rnd(100)<30)gain(p,'Carte topographique',1,out);else{const l=plantList(p.env);if(rnd(2))gain(p,l[rnd(l.length)].nom,1,out)}}
  }else{
    const armed=ATK(p)>=2||has(p,'garde');
    if(choice==='away'){if(armed)out.push('Il lit votre regard et bat en retraite.');else if(rnd(100)<30)stealOne();else out.push('Il finit par partir.')}
    else if(rnd(100)<(armed?15:40))stealOne();
    else{out.push('Il se révèle inoffensif, et laisse un bandage en partant.');gain(p,'Bandage',1,out)}
  }
  logj(`${p.nom} reçoit un visiteur (${v.nom}).`,p,tone);
  return{lines:out,tone};
}

const CAUSE_ADVICE={
 'hypothermie':'Hypothermie : isolez-vous du sol et du vent, gardez des vêtements secs, faites du feu avant la nuit, ne dormez pas sans abri. Les premiers signes (tremblements, maladresse, confusion) imposent d\'agir tout de suite.',
 'coup de chaleur':'Coup de chaleur : à l\'ombre aux heures chaudes, buvez régulièrement, bougez à l\'aube et au crépuscule, mouillez la nuque et le visage.',

 'froid':'Le froid vous a vaincu : équipez-vous tôt (fourrure, poncho), faites du feu et montez un abri avant la tombée de la nuit.',
 'chaleur':'La chaleur vous a épuisé : chapeau, gourde, abri, et ménagez vos points d\'action les jours de canicule.',
 'humidité':'L\'humidité vous a usé : cape de pluie, bottes, feu pour sécher, et un abri solide.',
 'soif':'Vous avez manqué d\'eau : gardez toujours deux sources d\'avance, ou construisez une citerne.',
 'faim':'La faim vous a eu : chassez et pêchez tôt, séchez les surplus, cultivez un jardin.',
 'hémorragie':'Un saignement mal soigné vous a tué : gardez toujours un bandage ou un cataplasme en main.',
 'infection':'Une infection vous a tué : bouillez l\'eau, gardez un antidote, apprenez la décoction antiseptique.',
 'épuisement':'L\'épuisement a eu raison de vous : reposez-vous avant que l\'énergie tombe sous 3.',
 'désespoir':'Le moral s\'est effondré : mangez chaud, dormez abrité, atteignez des objectifs, partagez avec d\'autres.'
};
function debrief(p){
  const s=p.st||{},dmg=p.dmg||{};
  const days=p.vivant?lastDay():(p.mort||lastDay());
  const nights=Math.max(0,days-1);
  const pct=Math.round(kgPct(p)*100);
  const goalsDone=Object.keys(p.goals||{}).length,goalsAll=GOALS.filter(g=>!g.solo||G.solo).length;
  const titre=p.vivant?(G.rescued?`Secouru au jour ${G.jour}`:`Survivant au jour ${G.jour}`):`Mort au jour ${p.mort} (${p.cause})`;
  const topDmg=Object.entries(dmg).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([k,v])=>`${k} ${v}`).join(', ')||'aucun';
  const chiffres=[
   ['Durée',`${days} jour${days>1?'s':''}`],
   ['Poids',`${fmtKg(p.kg0)} → ${fmtKg(p.kg)} kg (${pct>0?'+':''}${pct} %)`],
   ['Actions',`${s.explore||0} explorations, ${s.collect||0} collectes, ${s.craft||0} fabrications, ${s.rest||0} repos`],
   ['Rencontres',`${s.fightWin||0} combats gagnés, ${s.fightLose||0} perdus, ${s.visitors||0} visiteurs`],
   ['Remèdes',`${s.harvest||0} cueillettes, ${s.brew||0} préparés, ${(p.recettes||[]).length} recettes`],
   ['Dégâts reçus',topDmg],
   ['Moral',`minimum ${s.moralMin==null?7:s.moralMin}/10`],
   ['Objectifs',`${goalsDone}/${goalsAll}`],
   ['Corps',`de ${(s.coreMin==null?36.8:s.coreMin).toFixed(1).replace('.',',')} à ${(s.coreMax==null?36.8:s.coreMax).toFixed(1).replace('.',',')} °C`],
   ['Peur maximale',`${s.peurMax||0}/10 (${peurWord(s.peurMax||0).toLowerCase()})`],
   ['Conscience',`${ethicWord(p.ethic)}${s.helped?', '+s.helped+' personne(s) aidée(s)':''}`],
   ['Compétences',Object.keys(SKN).map(k=>SKN[k]+' '+skl(p,k)+'/5').join(', ')]
  ];
  const forces=[],faib=[],cons=[];
  if((s.craft||0)>=4)forces.push('Bon artisan : vous avez beaucoup fabriqué.');
  if(!(s.hungerNights)&&nights>=3)forces.push('Alimentation maîtrisée : aucune nuit à jeun.');
  if(!(s.thirstNights)&&nights>=3)forces.push('Hydratation maîtrisée : aucune nuit à sec.');
  if(p.hab>=2)forces.push(`Habitat solide (${HAB_NAMES[p.hab]}).`);
  if((s.brew||0)>0)forces.push('Vous savez soigner avec des plantes.');
  if(goalsDone>=goalsAll/2)forces.push('Beaucoup d\'objectifs de survie atteints.');
  if(pct>=0&&nights>=4)forces.push('Poids conservé : votre corps a tenu.');
  if(s.thirstNights){faib.push(`${s.thirstNights} nuit(s) à sec.`);cons.push('Chaque jour, vérifiez l\'eau avant de partir explorer. Sous 4, collectez ou buvez.')}
  if(s.hungerNights){faib.push(`${s.hungerNights} nuit(s) l\'estomac vide.`);cons.push('Séchez le gibier et le poisson, gardez des vivres durables (noix, ration, viande séchée).')}
  if(pct<=-10){faib.push(`Perte de poids importante (${pct} %).`);cons.push('Mangez régulièrement : en dessous de −10 % le sommeil répare moins, à −20 % vous perdez un PA.')}
  if(((dmg.froid||0)+(dmg.chaleur||0)+(dmg['humidité']||0))>=4){faib.push('Beaucoup de dégâts de stress de nuit.');cons.push('Habitat, vêtement adapté à l\'environnement et feu réduisent les nuits difficiles.')}
  if((s.apLeft||0)/Math.max(1,nights)>=1.5){faib.push('Points d\'action souvent gaspillés.');cons.push('Un PA inutilisé ne sert à rien : explorez, collectez ou préparez des plantes.')}
  if((s.moralMin==null?7:s.moralMin)<=2){faib.push('Moral tombé très bas.');cons.push('Un repas chaud, un abri, un objectif atteint ou une tisane relèvent le moral.')}
  if(p.hab===0&&nights>=2){faib.push('Aucun habitat construit.');cons.push('Un abri de fortune (2 Bois + 1 Fibres) change chaque nuit.')}
  if(!(s.signal)&&nights>=8){faib.push('Aucun signal lancé.');cons.push('Sans signal, personne ne viendra. Visez un feu et 2 Bois dès que le camp est stable.')}
  if(!p.vivant&&CAUSE_ADVICE[p.cause])cons.unshift(CAUSE_ADVICE[p.cause]);
  const h=ENV_HELP[p.env];if(h)cons.push('Sur ce terrain : '+h.plan[0]);
  if(!forces.length)forces.push('Vous avez tenu jusqu\'au bout de votre route.');
  if(!faib.length)faib.push('Pas de faiblesse flagrante dans cette partie.');
  return{titre,chiffres,forces,faib,cons:cons.slice(0,6),kgH:p.kgH||[]};
}

const BACKS={

function initHuman(p){
  const s=p.spec||{};
  p.sex=s.sex||'H';p.age=Math.max(16,Math.min(80,+s.age||35));p.ht=Math.max(140,Math.min(210,+s.ht||175));p.fit=s.fit==null?1:+s.fit;
  p.back=BACKS[s.back]?s.back:'rando';p.temp=TEMPS[s.temp]?s.temp:'equilibre';p.motiv=MOTIVS[s.motiv]?s.motiv:'famille';
  p.sk=Object.assign({},BACKS[p.back].sk);
  p.core=36.8;p.peur=TEMPS[p.temp].peur+(G.diff>=4?1:0);p.ethic=50;p.mentalDay=0;
  p.moral=Math.max(3,Math.min(9,7+TEMPS[p.temp].moral+MOTIVS[p.motiv].moral+(G.diff===1?1:G.diff>=4?-1:0)));
  p.st=p.st||{};p.st.coreMin=36.8;p.st.coreMax=36.8;p.st.peurMax=p.peur;
}
const coreWord=c=>c>=41?'Coup de chaleur':c>=39?'Surchauffe':c>=37.8?'Très chaud':c>=36.2?'Normal':c>=35.2?'Frais':c>=34?'Froid':c>=32?'Hypothermie':'Hypothermie grave';
const coreTone=c=>c>=36.2&&c<37.8?'ok':c>=35.2&&c<39?'warn':'bad';
const peurWord=v=>v<=2?'Calme':v<=4?'Inquiet':v<=6?'Angoissé':v<=8?'Terrifié':'Panique';
const dehyWord=e=>e>=9?'Hydraté':e>=7?'Soif légère':e>=4?'Soif nette':e>=2?'Déshydraté':'Critique';
const bmiOf=p=>p.kg/Math.pow(p.ht/100,2);

/* pénalité de points d'action liée au corps et à l'esprit */
function humanAP(p){
  let d=0;
  if(p.core<35)d--;if(p.core<33)d--;if(p.core>38.5)d--;if(p.core>40)d--;
  if(p.eau<=2)d--;if(p.eau<=0)d--;
  if(p.peur>=8)d--;
  if(p.age>=60)d--;
  return Math.max(-3,d);
}
const humanRec=p=>(p.fit>=2&&p.age<50?1:0)+(p.fit<=0||p.age>=60?-1:0);

/* eau de surface non traitée */
const RAW_RISK={marais:60,jungle:45,savane:40,foret:12,steppe:15,fjord:10,montagne:6,canyon:35};
function rawWaterRisk(p,out){
  if(has(p,'feu'))return false;
  const r=RAW_RISK[p.env]||0;
  if(rnd(100)<r){
    if(p.env==='marais'||p.env==='jungle'){addCond(p,'infection',out)}
    addCond(p,'gastro',out);return true;
  }
  return false;
}

/* nuit : température du corps, peur, gastro */
function humanNight(p,lines,sd){
  const e=envOf(p),w=WX[p.wx],st=p.st;
  /* le sens du stress dépend de la météo autant que du milieu : canicule = chaud partout, gel/blizzard = froid partout */
  const wxHot=p.wx==='canicule',wxCold=p.wx==='gel'||p.wx==='blizzard';
  const hot=wxHot||(e.stress==='chaud'&&!wxCold);
  const bm=bmiOf(p),fire=tagList(p).includes('feu');
  let ttgt=36.8;
  if(hot){
    if(sd>0)ttgt+=.9*sd;
    if(sd>0&&p.eau<=3)ttgt+=.6;
    if(sd>0&&p.hab>=1)ttgt-=.3;
  }else{
    if(sd>0)ttgt-=1.1*sd;
    if(sd>0&&w.rain&&!has(p,'cape')&&!tagList(p).includes('solide'))ttgt-=.4;
    if(sd>0&&fire)ttgt+=.4;
    if(sd>0&&p.hab>=1)ttgt+=.3;
    if(sd>0&&bm<19)ttgt-=.3;
    if(sd>0&&p.sat<=2)ttgt-=.3;
  }
  ttgt+=(p.fit-1)*(sd>0?(hot?-.15:.15):0);
  p.core=Math.round(Math.max(26,Math.min(43,p.core+(ttgt-p.core)*.55))*10)/10;
  st.coreMin=Math.min(st.coreMin==null?36.8:st.coreMin,p.core);st.coreMax=Math.max(st.coreMax==null?36.8:st.coreMax,p.core);
  const word=coreWord(p.core);
  if(p.core<35.2||p.core>=37.8)lines.push({t:`Corps : ${word.toLowerCase()}${G.analyse?' ('+p.core.toFixed(1).replace('.',',')+' °C)':''}.`,c:coreTone(p.core)==='bad'?'bad':''});
  if(p.core<31&&p.vivant){lines.push({t:'Hypothermie sévère : −2 PV.',c:'bad'});hurt(p,2,'hypothermie')}
  if(p.vivant&&p.core<28.5){die(p,'hypothermie')}
  if(p.vivant&&p.core>41){lines.push({t:'Coup de chaleur : −2 PV.',c:'bad'});hurt(p,2,'coup de chaleur')}
  if(p.vivant&&p.core>42.5){die(p,'coup de chaleur')}
  if(!p.vivant)return;
  if(p.cond.includes('gastro')){p.eau=Math.max(0,p.eau-2);lines.push({t:'Gastro-entérite : eau −2.',c:'bad'})}
  /* peur */
  let tgt=TEMPS[p.temp].peur+(G.diff>=4?1:0)+(p.cond.length?1:0)+(p.eau<=3?1:0)+(MORAL(p)<=3?2:0);
  tgt-=(tagList(p).includes('feu')?2:0)+(p.hab>=1?1:0)+(MORAL(p)>=8?1:0)+(p.pact?1:0);
  tgt=Math.max(0,Math.min(10,tgt));
  const pv0=p.peur;p.peur=Math.max(0,Math.min(10,Math.round(p.peur+(tgt-p.peur)*.5)));
  st.peurMax=Math.max(st.peurMax||0,p.peur);
  if(p.peur>=7&&p.peur>pv0)lines.push({t:`Peur : ${peurWord(p.peur).toLowerCase()}.`,c:'bad'});
  p.mentalDay=0;
}
/* début de journée : panique */
function humanMorning(p,out){
  if(p.peur>=9&&rnd(100)<35&&p.hand.length){
    const c=p.hand[rnd(p.hand.length)];removeFrom(p.hand,c);G.disc.push(c);cnt(p,'panic');mor(p,-1);
    out.push({t:`Panique : vous laissez tomber ${c.nom} dans votre précipitation.`,c:'bad'});
  }
  if(p.core<35)out.push({t:`Vous grelottez${G.analyse?' ('+p.core.toFixed(1).replace('.',',')+' °C)':''}. Le froid vous coûte des points d'action.`,c:'bad'});
  if(p.core>38.5)out.push({t:'Vous êtes en surchauffe. Ombre, eau et repos.',c:'bad'});
  if(p.eau<=2)out.push({t:'La déshydratation vous ralentit.',c:'bad'});
  if(p.peur>=8)out.push({t:'La peur vous paralyse en partie.',c:'bad'});
}

const MENTAL=[
 {id:'stop',nom:'S.T.O.P.',sub:'Stop, réfléchir, observer, planifier',peur:-3,moral:0},

];
function doMental(p,k){
  spend(p,1);const m=MENTAL.find(x=>x.id===k),f=p.mentalDay>=1?.5:1;p.mentalDay++;cnt(p,'mental');
  const dp=Math.round(m.peur*f),dm=Math.round(m.moral*f);
  p.peur=Math.max(0,Math.min(10,p.peur+dp));if(dm)mor(p,dm);
  train(p,'signal',.02);
  const out=[];if(dp)out.push(`Peur ${dp}. Vous êtes ${peurWord(p.peur).toLowerCase()}.`);if(dm)out.push(`Moral +${dm}.`);
  if(!out.length)out.push('Vous reprenez vos esprits.');
  return{lines:out,tone:'good'};
}
const addEthic=(p,d)=>{p.ethic=Math.max(0,Math.min(100,(p.ethic==null?50:p.ethic)+d))};

/* visiteurs réalistes */
function visitorExtra(p,v,choice,gift){
  const out=[];let tone='good';
  const nice=gift&&['food','plante','soin'].includes(gift.k);
  if(!['garde','berger','randonneur','braconnier'].includes(v.id))return null;
  cnt(p,'visitors');
  if(gift){removeFrom(p.hand,gift);G.disc.push(gift)}
  if(v.id==='garde'){
    if(choice==='away'){out.push('Vous restez à distance. Il note votre position et repart.');if(rnd(100)<25&&!G.rescue){G.rescue=G.jour+2;out.push('Il revient avec une équipe : secours attendus bientôt.')}}
    else{
      const pr=55+(G.signal>0?20:0)+(nice?10:0);
      if(rnd(100)<pr&&!G.rescue){G.rescue=G.jour+1;out.push('Il appelle les secours par radio. Ils arrivent demain.');mor(p,3)}
      else out.push('Il tente de joindre la radio sans succès, mais vous laisse ce qu\'il a.');
      gain(p,'Eau potable',1,out);gain(p,'Ration de survie',1,out);train(p,'eau',.2);train(p,'feu',.15);out.push('Il vous donne quelques conseils : compétences améliorées.');
    }
  }else if(v.id==='berger'){
    if(choice==='away')out.push('Il hoche la tête, garde son troupeau et poursuit sa route.');
    else{gain(p,'Eau potable',1,out);gain(p,'Viande séchée',1,out);if(nice)gain(p,'Peau',1,out);mor(p,2);train(p,'eau',.2);train(p,'nourriture',.2);out.push('Il vous montre où l\'eau se trouve dans la région : moral +2.')}
  }else if(v.id==='randonneur'){
    if(choice==='away'){addEthic(p,-6);mor(p,-2);tone='bad';out.push('Vous vous éloignez. Sa silhouette reste dans votre tête.')}
    else{
      addEthic(p,6);mor(p,2);cnt(p,'helped');out.push('Vous partagez ce que vous avez. Il vous remercie, soulagé.');
      if(rnd(100)<35){gain(p,'Bandage',1,out);out.push('Il vous laisse un bandage et vous indique un point d\'eau.')}
      if(rnd(100)<20&&!G.rescue){G.rescue=G.jour+2;out.push('Il connaît le coin : il reviendra avec de l\'aide. Secours dans deux jours.')}
    }
  }else{
    const armed=ATK(p)>=2||has(p,'garde');
    if(choice==='away'){if(armed)out.push('Il lit votre regard et bat en retraite.');else if(rnd(100)<35&&p.hand.length){const c=p.hand[rnd(p.hand.length)];removeFrom(p.hand,c);G.disc.push(c);out.push(`Il disparaît avec ${c.nom}.`);tone='bad'}else out.push('Il finit par s\'éloigner.');addEthic(p,0)}
    else if(rnd(100)<(armed?15:45)){
      tone='bad';if(p.hand.length){const c=p.hand[rnd(p.hand.length)];removeFrom(p.hand,c);G.disc.push(c);out.push(`Il vous dépouille : ${c.nom}.`)}
      if(rnd(100)<35){out.push('Il vous bouscule : −1 PV.');hurt(p,1,'braconnier')}
    }else{out.push('Il se révèle sans hostilité : il vous laisse du gibier.');gain(p,'Gibier',1,out)}
  }
  logj(`${p.nom} reçoit un visiteur (${v.nom}).`,p,tone);
  return{lines:out,tone};
}

/* ---------- Mode Guide : conseils et fiches ---------- */
function adviceCore(p){
  const e=envOf(p),sd=stressNight(p),L=[],A=(s,t,c)=>L.push({s,t,c:c===undefined?'bad':c});
  if(p.core<35.2)A(100,'URGENT : froid. Abri, vêtements secs, feu ; ne vous laissez pas glisser.');
  if(p.core>=38.5)A(100,'URGENT : surchauffe. Ombre, eau, repos ; ne marchez pas en plein soleil.');
  if(p.cond.includes('saignement'))A(95,'URGENT : saignement. Bandage ou pression ferme, tout de suite.');
  if(p.eau<=3)A(90,'Eau basse : cherchez de l\'eau et traitez-la (feu ou antidote) avant le reste.');
  if(p.cond.includes('infection'))A(80,'Infection : antidote ou plantes avant qu\'elle ne s\'aggrave.');
  if(p.cond.includes('gastro'))A(75,'Gastro-entérite : buvez de l\'eau potable, reposez-vous.');
  if(p.hab===0&&sd>0)A(78,'Cette nuit vous coûtera des PV : construisez un abri avant ce soir.');
  if(!tagList(p).includes('feu')&&(e.stress!=='chaud'))A(60,'Un feu réchauffe, sèche, assainit l\'eau et signale votre position.');
  if(p.sat<=3)A(70,'Faim : mangez ou chassez ; la nourriture est moins pressante que l\'eau.');
  if(p.peur>=7)A(65,'La peur monte : S.T.O.P. (menu Actions → Esprit).');
  if(p.ene<=3)A(55,'Énergie basse : reposez-vous avant d\'enchaîner les actions.');
  if(G.signal===0&&G.jour>=2)A(40,'Aucun signal : sans signal, personne ne vous trouvera.','');
  if(MORAL(p)<=3)A(50,'Moral bas : un repas chaud, un abri, un objectif atteint ou l\'Esprit le relèvent.');
  return L;
}

/* une carte se reconstruit toujours depuis le catalogue : seules ses valeurs d'usure sont reprises */
function cleanCard(c){
  c=OBJ(c);const def=DEF_BY.get(c.nom);if(!def)return null;
  const r=JSON.parse(JSON.stringify(def));delete r.n;
  r.uid=INT(c.uid,1,1e9,0);
  if(r.dur!=null){r.max=r.dur;r.dur=INT(c.dur,1,r.max,r.max)}
  if(r.perish)r.age=INT(c.age,0,99,0);
  if(c.set&&(r.tags||[]).includes('piège'))r.set=true;
  if(c.tmp)r.tmp=true;
  if(r.k==='pred')r.power=INT(c.power,def.power,def.power+3,def.power);

}

  N('pv',0,40,8);N('sat',0,10,7);N('eau',0,10,7);N('ene',0,10,8);N('moral',0,10,7);N('peur',0,10,0);
  p.hab=INT(raw.hab,0,3,0);N('ap',0,12,0);N('apMax',0,12,0);N('sig',0,99,0);p.rep=INT(raw.rep,-5,5,0);

let SHN=0;
const TRAPS=[];
function trap(el,onEsc){
  const prev=document.activeElement,t={el,onEsc};TRAPS.push(t);
  const app=document.getElementById('app');if(app)app.inert=true;
  return()=>{
    const i=TRAPS.indexOf(t);if(i>=0)TRAPS.splice(i,1);
    if(!TRAPS.length){const a=document.getElementById('app');if(a)a.inert=false;try{if(prev&&prev.isConnected)prev.focus({preventScroll:true})}catch(e){}}
  };
}
document.addEventListener('keydown',e=>{
  const t=TRAPS[TRAPS.length-1];if(!t)return;
  if(e.key==='Escape'){if(t.onEsc){e.preventDefault();t.onEsc()}return}
  if(e.key!=='Tab')return;
  const f=[...t.el.querySelectorAll('button:not([disabled]),textarea,input,select,[href]')].filter(x=>!x.hidden&&x.offsetParent!==null);
  if(!f.length){e.preventDefault();return}
  const a=f[0],z=f[f.length-1],cur=document.activeElement;
  if(!t.el.contains(cur)){e.preventDefault();a.focus()}
  else if(e.shiftKey&&cur===a){e.preventDefault();z.focus()}
  else if(!e.shiftKey&&cur===z){e.preventDefault();a.focus()}
},true);
function mount(el,onEsc,host){
  (host||$('#sheets')).appendChild(el);
  const rel=trap(el,onEsc),rm=el.remove.bind(el);
  el.remove=()=>{rel();rm()};
  return el;
}
function sheet(html,opt={}){
  return new Promise(res=>{
    const el=document.createElement('div');el.className='scrim';
    el.innerHTML=`<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;
    const sh=el.firstElementChild;
    const done=v=>{el.remove();res(v)};
    mount(el,()=>{
      if(opt.dismiss)return done({v:'close'});
      for(const k of ['close','cancel','n','no','ok']){const b=sh.querySelector(`[data-r="${k}"]:not([disabled])`);if(b)return done({v:k,uid:0})}
    });
    sh.scrollTop=0;
    const h=sh.querySelector('h2');if(h){h.id='shh'+(++SHN);sh.setAttribute('aria-labelledby',h.id)}
    const first=sh.querySelector('[data-r]:not([disabled])');if(first&&!opt.noFocus)first.focus({preventScroll:true});
    el.addEventListener('click',e=>{
      const b=e.target.closest('[data-r]');
      if(!b){if(opt.dismiss&&e.target===el)done({v:'close'});return}
      if(opt.keep&&opt.keep(b,el))return;
      done({v:b.dataset.r,uid:+b.dataset.uid||0});
    });
  });
}

function advice(p){
  /* priorités critiques (corps, peur, blessures, eau, faim, énergie, moral) puis conseils de contexte */
  const L=adviceCore(p),WN=WX[p.wxNext],e=envOf(p),X=(s,t,c)=>L.push({s,t,c:c===undefined?'':c});
  if(p.pv<=Math.ceil(pvMax(p)/2))X(85,`Santé à ${p.pv}/${pvMax(p)} : évitez les explorations risquées et soignez-vous.`,'bad');
  if(weightState(p).n>0)X(52,`${weightState(p).t} Poids ${fmtKg(p.kg)} kg (départ ${fmtKg(p.kg0)}). Mangez régulièrement.`,'bad');
  if(p.cond.length&&knownRem(p).length&&plantsOf(p).length)X(68,'Vous avez des plantes et une recette : préparez un remède (Actions).');
  p.cond.forEach(c=>{if(!['saignement','infection','gastro'].includes(c))X(72,`${COND_LABEL[c]} : ${COND_TXT[c]}`,'bad')});
  if(WN.st||WN.ap<0||WN.expl)X(45,`Demain : ${WN.nom}. ${WN.txt} Préparez-vous aujourd'hui.`);
  if(WN.rain&&!has(p,'récipient'))X(44,'De la pluie est annoncée : un récipient la transformerait en eau.');
  if(p.hab===0)X(42,'Aucun habitat : un abri de fortune (2 Bois + 1 Fibres) protège chaque nuit.');
  if(G.signal<signalGoal())X(30,`Signal ${G.signal}/${signalGoal()} : 2 Bois + un feu (ou un miroir) pour allumer un signal. C'est la voie vers les secours.`);
  if(!has(p,'citerne')&&has(p,'outil')&&matCount(p,'Bois')>=2&&matCount(p,'Fibres')>=2)X(25,'Vous avez de quoi fabriquer une citerne : de l\'eau chaque nuit.');
  const sf=seasonFx(p);X(20,`Saison : ${seasonName()} (jour ${seasonDay()}/${SEASON_LEN}). ${sf.txt}`);
  if(!G.jours)X(10,'Temps illimité : seuls les secours ou la mort mettent fin à la partie. Chaque année (32 jours) durcit les nuits.');
  L.sort((a,b)=>b.s-a.s);
  const seen=new Set(),top=[];
  L.forEach(x=>{if(!seen.has(x.t)&&top.length<4){seen.add(x.t);top.push(x)}});
  return top;
}

function sparkSvg(h,key,fmt){
  if(!h||h.length<2)return '';
  const xs=h.map(e=>e.j),ys=h.map(e=>e[key]),mn=Math.min(...ys),mx=Math.max(...ys),sp=(mx-mn)||1;
  const x=v=>4+(v-xs[0])/((xs[xs.length-1]-xs[0])||1)*292,y=v=>56-(v-mn)/sp*48;
  const pts=h.map(e=>`${x(e.j).toFixed(1)},${y(e[key]).toFixed(1)}`).join(' ');
  return `<svg class="spark" viewBox="0 0 300 64" preserveAspectRatio="none" role="img" aria-label="Courbe de poids de ${fmt(ys[0])} à ${fmt(ys[ys.length-1])}"><polyline points="${pts}" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/></svg><div class="mono" style="display:flex;justify-content:space-between"><span>jour ${xs[0]} · ${fmt(ys[0])}</span><span>jour ${xs[xs.length-1]} · ${fmt(ys[ys.length-1])}</span></div>`;
}

        if(k==='import'){
          if(importSave(SAVE_IN)){SAVE_IN='';el.remove();res();flash('Partie importée : reprenez-la dans la liste.');UI.screen='setup';render()}
          else flash('Code invalide.');
        }
        return;
      }
      const b=ev.target.closest('[data-t],[data-e],[data-b]');if(!b)return;
      if(b.dataset.t)T=b.dataset.t;if(b.dataset.e)E=b.dataset.e;if(b.dataset.b!=null&&b.dataset.b!=='')B=+b.dataset.b;
      redraw(!!b.dataset.e||b.dataset.b!=null);
    });
  });
}

function rulesHtml(){return `<h2>Règles</h2><div class="lines">
 <p><b>Réel</b> : un seul personnage, avec son âge, son poids, sa condition, son expérience, son tempérament. Le <b>corps</b> a une température (froid, chaleur), la <b>peur</b> monte et paralyse, la <b>conscience</b> pèse après vos choix envers les visiteurs. L'eau de surface non traitée rend malade. Vos <b>compétences</b> (feu, abri, eau, nourriture, secours, signal) progressent par la pratique. Dans <b>Esprit</b> (menu Actions) : S.T.O.P., respiration, penser aux proches, écrire. Le <b>mode Guide</b> affiche les priorités du moment et un conseil après chaque action. La simulation simplifie la réalité : elle entraîne le raisonnement, elle ne remplace ni une formation ni un équipement.</p>
 <p><b>But</b> : tenir jusqu'au dernier jour, ou être secouru. En mode illimité, la partie ne s'arrête qu'aux secours ou à la mort. En solo, les Habitants du lieu peuvent devenir alliés ou ennemis.</p>
 <p><b>Points d'action (PA)</b> : 4 par jour, moins si vous êtes fatigué ou blessé. Explorer, collecter, fabriquer, se reposer et signaler coûtent 1 PA. Construire un habitat en coûte 2. Équiper, manger, boire, et se soigner sont gratuits.</p>
 <p><b>Cache</b> : 1 PA pour cacher un objet ou un matériau (pas les vivres périssables). Ce qui est caché échappe aux vols, aux pillages et aux pertes de la nuit. Capacité : 2 + niveau d'habitat. Reprendre en main est gratuit si la main n'est pas pleine.</p>
 <p><b>Renforcer l'abri</b> : 1 PA et 2 matériaux, jusqu'à 2 fois, retire 1 point de stress à chaque nuit. Orage, grand vent, blizzard et vent de sable en abîment un niveau. <b>Entretenir le feu</b> : 1 PA, 1 Bois et un outil à feu : le foyer dure 3 nuits (moins s'il pleut ou vente sans habitat solide), compte comme feu et épargne l'usure de l'outil. <b>À l'affût</b> : 1 PA, énergie −1, canne ou arme : pêche ou chasse immédiate. À la chasse, une bête touchée peut se retourner : on l'achève (force contre force) ou on lâche prise. <b>Fumer</b> : avec un Fumoir et du feu, 1 PA transforme jusqu'à 4 Poissons ou Gibiers frais en vivres fumés qui ne pourrissent pas. <b>Veiller</b> : 1 PA, énergie −2 au matin ; aucune surprise nocturne, et avec un feu le stress de la nuit baisse de 1.</p>
 <p><b>Explorer</b> : 2 cartes. Prédateurs, proies, aléas, chances et rencontres se résolvent tout de suite. Le brouillard double le coût.</p>
 <p><b>Besoins</b> : faim, eau et énergie baissent chaque nuit. À zéro, vous perdez de la santé. Le froid, la chaleur et l'humidité frappent la nuit, réduits par vos vêtements et votre habitat.</p>
 <p><b>Météo et saisons</b> : la météo du jour et la prévision de demain sont affichées. Les saisons durent ${SEASON_LEN} jours et changent le stress de nuit, la soif et la cueillette selon l'environnement. En illimité, chaque année écoulée durcit un peu plus les nuits.</p>
 <p><b>Moral</b> : de 0 à 10. Bien dormi, nourri, abrité et objectifs atteints le font monter ; blessures, nuits rudes, rôdeurs, faim et soif le font chuter. À 3 ou moins le sommeil est moins réparateur, à 2 ou moins vous perdez 1 PA, à 0 vous perdez des PV.</p>
 <p><b>Nuit</b> : un rôdeur, le vent sur le feu ou un mauvais sommeil peuvent vous surprendre. Un feu, un habitat solide et une arme réduisent ces risques.</p>
 <p><b>Structures</b> : citerne (eau chaque nuit), jardin (vivres), fumoir (conservation). Elles s'usent mais se réparent.</p>
 <p><b>Usure</b> : tout ce qui a une barre de durabilité s'use et disparaît à zéro. Les vêtements s'usent la nuit, les outils quand vous les utilisez. Réparez-les avec un outil et un matériau.</p>
 <p><b>Vivres</b> : la viande et le poisson frais pourrissent en 1 à 3 nuits. Séchez-les près d'un feu, ou gardez-les dans un récipient ou une cabane.</p>
 <p><b>Fabrication</b> : bois, pierre, fibres et peau se transforment en outils, vêtements, abri, feu, attelle.</p>
 <p><b>Blessures</b> : saignement, fracture, infection durent plusieurs nuits. Chacune a son soin.</p>
 <p><b>Habitat</b> : chaque niveau protège, ajoute 2 PV max et améliore le sommeil. Le refuge fournit un foyer permanent.</p>
 <p><b>Signal de détresse</b> : brûlez du bois (2 Bois + feu). À ${SIGNAL_GOAL} signaux au total (${SIGNAL_GOAL-1} en solo, un de plus en Enfer), les secours tentent chaque jour de vous repérer : chaque signal supplémentaire augmente la chance. Un passage manqué affaiblit le signal. Quand ils vous voient, ils arrivent le lendemain et tout le monde est sauvé.</p>
 <p><b>Poids</b> : chaque personnage a un poids de départ (réglable). Chaque matin vous voyez le poids gagné ou perdu : bien nourri et hydraté, il se maintient ; à jeun, il fond. À −10 % le sommeil répare moins, à −20 % vous perdez 1 PA.</p>
 <p><b>Plantes et remèdes</b> : cherchez des plantes (Actions, Collecter) ; chacune a deux vertus. Une fois la recette apprise d'un visiteur (ou des Habitants alliés), préparez cataplasme, décoction, tonique, tisane ou panacée.</p>
 <p><b>Visiteurs</b> : un inconnu approche (garde forestier, berger, randonneur blessé, braconnier, herboriste, colporteur…). Vous ne savez qui il est qu'après avoir choisi comment l'accueillir. Aider ou abandonner quelqu'un pèse sur votre conscience.</p>
 <p><b>Sauvegarde</b> : automatique à chaque étape ; vous pouvez aussi sauvegarder, exporter ou importer une partie (Aide, onglet Partie).</p>
 <p><b>Solo</b> : les Habitants décident seuls de leur attitude. Votre réputation, votre présentation et vos présents pèsent sur leur choix, jamais ne le garantissent.</p></div>${okBtn('Compris')}`}

/* ----- explorer ----- */
async function explore(){
  const p=cp(),cost=apCost(p,'explore');if(p.ap<cost)return;guideAfter('explore');
  writeSave();UI.enc=true;
  try{
    spend(p,cost);render();
    for(let i=0;i<EXPLORE_DRAWS&&p.vivant;i++){
      const c=draw(p);
      if(!c){await sheet(`<h2>Pioche épuisée</h2><p>Plus aucune carte à tirer.</p>${okBtn()}`);break}
      if(c.k==='chance')await chanceFlow(p,c,i);
      else if(c.k==='locaux')await localFlow(p,c);
      else if(c.k==='visiteur')await visitorFlow(p,c);
      else if(isThreat(c))await threatFlow(p,c,i);
      else{await sheet(`<div class="mono">Carte ${i+1} sur ${EXPLORE_DRAWS}</div>${cardHtml(c,{big:1,tag:'article',p})}${guideBox()}${okBtn('Prendre en main')}`);p.hand.push(c)}
    }
    UI.enc=false;render();
    if(!p.vivant)await deathFlow(p);
  }finally{UI.enc=false}
}
async function visitorFlow(p,c){
  const v=VISITORS[rnd(VISITORS.length)];G.disc.push(c);
  for(;;){
    const r=await sheet(`<div class="mono">Un visiteur</div><h2>Quelqu'un approche</h2>${cardHtml(c,{big:1,tag:'article',p})}<p>${esc(v.hint)}</p><p>Comment l'accueillez-vous ?</p>
      <div class="btns"><button class="btn pri" data-r="meal" ${p.hand.length?'':'disabled'}>Partager un repas<small>donner une carte, de préférence des vivres</small></button>
      <button class="btn" data-r="trade" ${p.hand.length?'':'disabled'}>Échanger<small>donner une carte</small></button>
      <button class="btn ghost" data-r="away">Garder ses distances</button></div>`);
    let gift=null;
    if(r.v!=='away'){const pk=await pickCards('Votre geste','Quelle carte offrez-vous ?',p.hand,1,'Donner',true);if(!pk)continue;gift=p.hand.find(h=>h.uid===pk[0])}
    const res=visitorResolve(p,v,r.v,gift);guideAfter('visitor');
    await sheet(`<div class="mono">C'était : ${esc(v.nom)}</div><h2>${res.tone==='bad'?'Méfiance justifiée':'Une rencontre utile'}</h2>${linesHtml(res.lines.map(t=>({t,c:res.tone})))}${guideBox()}${okBtn()}`);

  }
}
async function chanceFlow(p,c,i){
  const out=resolveChance(p,c);
  await sheet(`<div class="mono">Carte ${i+1} sur ${EXPLORE_DRAWS}</div><h2>Un coup de chance</h2>${cardHtml(c,{big:1,tag:'article',p})}${linesHtml(out.map(t=>({t,c:'good'})))}${guideBox()}${okBtn()}`);
}
function threatSheet(p,t,inf,i){
  const b=[];if(t.k==='pred')fx('danger');
  if(t.k==='pred'){
    if(inf.counter)b.push(`<button class="btn pri" data-r="counter">Repousser<small>${esc(inf.counter.label)}</small></button>`);
    b.push(`<button class="btn ${inf.counter?'':'pri'}" data-r="fight" ${inf.atk?'':'disabled'}>Combattre<small>ATQ ${inf.atk} contre FORCE ${t.power} : ${inf.win?'victoire, gibier et peau':'défaite, −'+inf.dmgFail+' PV'}</small></button>`);
    b.push(`<button class="btn" data-r="endure">Encaisser<small>DÉF ${inf.def} : −${inf.dmgEndure} PV</small></button>`);
  }
  if(t.k==='proie'){
    if(inf.tool)b.push(`<button class="btn pri" data-r="hunt">Chasser<small>avec ${esc(inf.tool.nom)} : +${t.lootN} ${esc(t.loot)}${t.extra?' + '+t.extra:''}</small></button>`);
    b.push(`<button class="btn" data-r="skip">Laisser filer</button>`);
  }
  if(t.k==='malus'){
    if(inf.counter)b.push(`<button class="btn pri" data-r="counter">Contrer<small>${esc(inf.counter.label)}</small></button>`);
    b.push(`<button class="btn" data-r="suffer">Subir</button>`);
  }
  const head={pred:'Un prédateur !',proie:'Une proie',malus:'Un aléa'}[t.k];
  return `<div class="mono">Carte ${i+1} sur ${EXPLORE_DRAWS}</div><h2>${head}</h2>${cardHtml(t,{big:1,tag:'article',p})}<div class="btns">${b.join('')}</div>`;
}
async function threatFlow(p,t,i){
  guideAfter('threat:'+t.k);
  for(;;){
    const inf=threatInfo(p,t);
    const r=await sheet(threatSheet(p,t,inf,i));
    const res=resolve(p,t,r.v);
    await resultSheet(toneTitle(res.tone,'Bien joué','Aïe','Résultat'),res);
    return;
  }
}
